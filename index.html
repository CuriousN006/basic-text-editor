          const paragraph = docxParagraphXml(item, context, {
            nodes: inlineNodes,
            numbering: { numId: list.tagName === 'OL' ? 2 : 1, level }
          });
          const nested = [...item.children]
            .filter((child) => ['UL', 'OL'].includes(child.tagName))
            .map((child) => docxListXml(child, context, level + 1))
            .join('');
          return paragraph + nested;
        })
        .join('');

      const docxTableWidths = (rows, columnCount) => {
        const weights = Array.from({ length: columnCount }, () => 10);
        rows.forEach((row) => {
          [...row.cells].forEach((cell, index) => {
            if (index < columnCount) weights[index] = Math.max(weights[index], Math.min(60, cell.innerText.trim().length || 1));
          });
        });
        const minimum = Math.min(900, Math.floor(9360 / columnCount));
        const remaining = 9360 - (minimum * columnCount);
        const total = weights.reduce((sum, weight) => sum + weight, 0);
        const widths = weights.map((weight) => minimum + Math.floor(Math.max(0, remaining) * weight / total));
        widths[widths.length - 1] += 9360 - widths.reduce((sum, width) => sum + width, 0);
        return widths;
      };

      const docxTableXml = (table, context) => {
        const rows = [...table.rows];
        const columnCount = Math.max(1, ...rows.map((row) => row.cells.length));
        const widths = docxTableWidths(rows, columnCount);
        const grid = widths.map((width) => '<w:gridCol w:w="' + width + '"/>').join('');
        const rowXml = rows.map((row) => {

              initialState: { bold: cell.tagName === 'TH' }

            const shading = cell.tagName === 'TH' ? '<w:shd w:val="clear" w:color="auto" w:fill="F2F4F7"/>' : '';

          return '<w:tr>' + cells + '</w:tr>';
        }).join('');
        return '<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblInd w:w="120" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="CBD5E1"/><w:left w:val="single" w:sz="4" w:color="CBD5E1"/><w:bottom w:val="single" w:sz="4" w:color="CBD5E1"/><w:right w:val="single" w:sz="4" w:color="CBD5E1"/><w:insideH w:val="single" w:sz="4" w:color="CBD5E1"/><w:insideV w:val="single" w:sz="4" w:color="CBD5E1"/></w:tblBorders><w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:start w:w="120" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:end w:w="120" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>' + grid + '</w:tblGrid>' + rowXml + '</w:tbl>';
      };

      const docxBlockXml = (node, context) => {

          H6: 'Heading3',
          BLOCKQUOTE: 'BlockQuote',
          PRE: 'Preformatted'

      const docxNumberingXml = () => {

        '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:uiPriority w:val="9"/><w:pPr><w:keepNext/><w:keepLines/><w:spacing w:before="280" w:after="140"/></w:pPr><w:rPr><w:b/><w:sz w:val="37"/><w:szCs w:val="37"/><w:color w:val="202124"/></w:rPr></w:style>' +
        '<w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:uiPriority w:val="9"/><w:pPr><w:keepNext/><w:keepLines/><w:spacing w:before="200" w:after="100"/></w:pPr><w:rPr><w:b/><w:sz w:val="30"/><w:szCs w:val="30"/><w:color w:val="202124"/></w:rPr></w:style>' +
        '<w:style w:type="paragraph" w:styleId="BlockQuote"><w:name w:val="Block Quote"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:ind w:left="360" w:right="240"/><w:spacing w:before="120" w:after="120"/><w:pBdr><w:left w:val="single" w:sz="18" w:space="8" w:color="94A3B8"/></w:pBdr><w:shd w:val="clear" w:color="auto" w:fill="F8FAFC"/></w:pPr><w:rPr><w:color w:val="475569"/></w:rPr></w:style>' +
        '<w:style w:type="paragraph" w:styleId="Preformatted"><w:name w:val="Preformatted"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:before="120" w:after="160" w:line="280" w:lineRule="auto"/><w:ind w:left="240" w:right="240"/><w:shd w:val="clear" w:color="auto" w:fill="F4F5F7"/></w:pPr><w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:eastAsia="Consolas"/><w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr></w:style>' +
        '</w:styles>';

      const zipCrc32 = (bytes) => {
        const table = zipCrc32.table || (zipCrc32.table = Array.from({ length: 256 }, (_, index) => {
          let value = index;
          for (let bit = 0; bit < 8; bit += 1) value = (value & 1) ? (0xEDB88320 ^ (value >>> 1)) : (value >>> 1);
          return value >>> 0;
        }));
        let crc = 0xFFFFFFFF;
        bytes.forEach((byte) => { crc = table[(crc ^ byte) & 0xFF] ^ (crc >>> 8); });
        return (crc ^ 0xFFFFFFFF) >>> 0;
      };

      const zipU16 = (value) => new Uint8Array([value & 0xFF, (value >>> 8) & 0xFF]);
      const zipU32 = (value) => new Uint8Array([value & 0xFF, (value >>> 8) & 0xFF, (value >>> 16) & 0xFF, (value >>> 24) & 0xFF]);
      const zipConcat = (parts) => {
        const output = new Uint8Array(parts.reduce((size, part) => size + part.length, 0));
        let offset = 0;
        parts.forEach((part) => {
          output.set(part, offset);
          offset += part.length;
        });
        return output;
      };

      const createStoredZip = (entries) => {
        const encoder = new TextEncoder();
        const now = new Date();
        const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
        const dosDate = ((Math.max(1980, now.getFullYear()) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
        const localParts = [];
        const centralParts = [];
        let offset = 0;

        entries.forEach(([name, content]) => {
          const nameBytes = encoder.encode(name);
          const data = content instanceof Uint8Array ? content : encoder.encode(content);
          const crc = zipCrc32(data);
          const localHeader = zipConcat([
            zipU32(0x04034B50), zipU16(20), zipU16(0x0800), zipU16(0), zipU16(dosTime), zipU16(dosDate),
            zipU32(crc), zipU32(data.length), zipU32(data.length), zipU16(nameBytes.length), zipU16(0), nameBytes
          ]);
          const centralHeader = zipConcat([
            zipU32(0x02014B50), zipU16(20), zipU16(20), zipU16(0x0800), zipU16(0), zipU16(dosTime), zipU16(dosDate),
            zipU32(crc), zipU32(data.length), zipU32(data.length), zipU16(nameBytes.length), zipU16(0), zipU16(0),
            zipU16(0), zipU16(0), zipU32(0), zipU32(offset), nameBytes
          ]);
          localParts.push(localHeader, data);
          centralParts.push(centralHeader);
          offset += localHeader.length + data.length;
        });

        const centralDirectory = zipConcat(centralParts);
        const endRecord = zipConcat([
          zipU32(0x06054B50), zipU16(0), zipU16(0), zipU16(entries.length), zipU16(entries.length),
          zipU32(centralDirectory.length), zipU32(offset), zipU16(0)
        ]);
        return new Blob([...localParts, centralDirectory, endRecord], {
          type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
        });
      };

      const buildDocxBlob = () => {
        const context = { hyperlinks: new Map(), nextRelationshipId: 3 };
        const body = [...editor.childNodes].map((node) => docxBlockXml(node, context)).join('');
        const relationships = [
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>',
          '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
        ];
        context.hyperlinks.forEach((relationshipId, href) => {
          relationships.push('<Relationship Id="' + relationshipId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + xmlEscape(href) + '" TargetMode="External"/>');
        });
        const timestamp = new Date().toISOString();
        const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>' +
          (body || '<w:p/>') +
          '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/><w:cols w:space="708"/><w:docGrid w:linePitch="360"/></w:sectPr></w:body></w:document>';
        const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>';
        const rootRelationships = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>';
        const documentRelationships = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + relationships.join('') + '</Relationships>';
        const coreProperties = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>' + xmlEscape(currentFileName.replace(/\.[^.]+$/, '') || '문서') + '</dc:title><dc:creator>오프라인 리치 라이터</dc:creator><cp:lastModifiedBy>오프라인 리치 라이터</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:modified></cp:coreProperties>';
        const appProperties = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>오프라인 리치 라이터</Application><DocSecurity>0</DocSecurity><ScaleCrop>false</ScaleCrop><Company></Company><LinksUpToDate>false</LinksUpToDate><SharedDoc>false</SharedDoc><HyperlinksChanged>false</HyperlinksChanged><AppVersion>1.0</AppVersion></Properties>';

        return createStoredZip([
          ['[Content_Types].xml', contentTypes],
          ['_rels/.rels', rootRelationships],
          ['docProps/core.xml', coreProperties],
          ['docProps/app.xml', appProperties],
          ['word/document.xml', documentXml],
          ['word/styles.xml', docxStylesXml()],
          ['word/numbering.xml', docxNumberingXml()],
          ['word/_rels/document.xml.rels', documentRelationships]
        ]);
      };

      const downloadBlob = (blob, fileName) => {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const writeToFileHandle = async (handle, content) => {
        const writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
      };

      const saveHtmlDocument = async () => {
        if (typeof window.showSaveFilePicker !== 'function') {
          downloadText(buildStandaloneHtml(), suggestedName('html'), 'text/html');
          markDocumentSavedUnverified();
          showToast('HTML 파일을 내려받았습니다.');
          return;
        }

        const hadHandle = Boolean(currentHtmlFileHandle);
        try {
          if (!currentHtmlFileHandle) {
            currentHtmlFileHandle = await window.showSaveFilePicker({
              suggestedName: suggestedName('html'),
              types: [{ description: 'HTML 문서', accept: { 'text/html': ['.html', '.htm'] } }]
            });
          }
          await writeToFileHandle(currentHtmlFileHandle, buildStandaloneHtml());
          currentFileName = currentHtmlFileHandle.name;
          markDocumentClean();
          updateCount();
          showToast(hadHandle
            ? `${currentFileName} 파일을 업데이트했습니다.`
            : `${currentFileName} 파일로 저장했습니다.`);
        } catch (error) {
          if (error?.name === 'AbortError') return;
          currentHtmlFileHandle = null;
          showToast('HTML 파일을 저장하지 못했습니다.');
        }
      };

      const saveMarkdownDocument = async () => {
        if (typeof window.showSaveFilePicker !== 'function') {
          downloadText(htmlToMarkdown(), suggestedName('md'), 'text/markdown');
          markDocumentSavedUnverified();
          showToast('마크다운 파일을 내려받았습니다.');
          return;
        }

        const hadHandle = Boolean(currentMarkdownFileHandle);
        try {
          if (!currentMarkdownFileHandle) {
            currentMarkdownFileHandle = await window.showSaveFilePicker({
              suggestedName: suggestedName('md'),
              types: [{ description: '마크다운 문서', accept: { 'text/markdown': ['.md', '.markdown'] } }]
            });
          }
          await writeToFileHandle(currentMarkdownFileHandle, htmlToMarkdown());
          currentFileName = currentMarkdownFileHandle.name;
          markDocumentClean();
          updateCount();
          showToast(hadHandle
            ? `${currentFileName} 파일을 업데이트했습니다.`
            : `${currentFileName} 파일로 저장했습니다.`);
        } catch (error) {
          if (error?.name === 'AbortError') return;
          currentMarkdownFileHandle = null;
          showToast('마크다운 파일을 저장하지 못했습니다.');
        }
      };

      const saveDocxDocument = async () => {
        const mime = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
        if (typeof window.showSaveFilePicker !== 'function') {
          try {
            downloadBlob(buildDocxBlob(), suggestedName('docx'));
            markDocumentSavedUnverified();
            showToast('DOCX 파일을 내려받았습니다.');
          } catch (error) {
            showToast('DOCX 파일을 만들지 못했습니다.');
          }
          return;
        }

        const hadHandle = Boolean(currentDocxFileHandle);
        try {
          if (!currentDocxFileHandle) {
            currentDocxFileHandle = await window.showSaveFilePicker({
              suggestedName: suggestedName('docx'),
              types: [{ description: 'Microsoft Word 문서', accept: { [mime]: ['.docx'] } }]
            });
          }
          await writeToFileHandle(currentDocxFileHandle, buildDocxBlob());
          currentFileName = currentDocxFileHandle.name;
          markDocumentClean();
          updateCount();
          showToast(hadHandle
            ? currentFileName + ' 파일을 업데이트했습니다.'
            : currentFileName + ' 파일로 저장했습니다.');
        } catch (error) {
          if (error?.name === 'AbortError') return;
          currentDocxFileHandle = null;
          showToast('DOCX 파일을 저장하지 못했습니다.');
        }
      };

      const loadDocumentFile = async (file, handle = null) => {
        if (!confirmDiscardChanges()) return false;
        const text = await file.text();
        if (/\.html?$/i.test(file.name)) {
          const parsed = new DOMParser().parseFromString(text, 'text/html');
          editor.innerHTML = sanitizeHtml(parsed.body.innerHTML);
          currentHtmlFileHandle = handle;
          currentMarkdownFileHandle = null;
          currentDocxFileHandle = null;
        } else if (/\.(md|markdown)$/i.test(file.name)) {
          editor.innerHTML = markdownToHtml(text);
          currentHtmlFileHandle = null;
          currentMarkdownFileHandle = handle;
          currentDocxFileHandle = null;
        } else {
          editor.innerHTML = text.split(/\r?\n/).map((line) => line ? `<p>${escapeHtml(line)}</p>` : '<p class="blank-line"><br></p>').join('');
          currentHtmlFileHandle = null;
          currentMarkdownFileHandle = null;
          currentDocxFileHandle = null;
        }
        normalizeEmptyDocument();
        currentFileName = file.name;
        markDocumentClean();
        resetEditorHistory();
        updateCount();
        focusEditor();
        showToast(`${file.name} 파일을 열었습니다.`);
        return true;
      };

      const openDocument = async () => {
        if (typeof window.showOpenFilePicker !== 'function') {
          fileInput.click();
          return;
        }
        try {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{
              description: '문서 파일',
              accept: {
                'text/html': ['.html', '.htm'],
                'text/markdown': ['.md', '.markdown'],
                'text/plain': ['.txt']
              }
            }]
          });
          if (handle) await loadDocumentFile(await handle.getFile(), handle);
        } catch (error) {
          if (error?.name !== 'AbortError') showToast('파일을 열지 못했습니다.');
        }
      };

      const replaceClipboardTag = (element, tagName) => {
        const replacement = document.createElement(tagName);
        while (element.firstChild) replacement.appendChild(element.firstChild);
        element.replaceWith(replacement);
        return replacement;
      };

      const normalizeClipboardFormatting = (container) => {
        [...container.querySelectorAll('strong')].forEach((element) => replaceClipboardTag(element, 'b'));
        [...container.querySelectorAll('em')].forEach((element) => replaceClipboardTag(element, 'i'));
        [...container.querySelectorAll('strike')].forEach((element) => replaceClipboardTag(element, 's'));

        [...container.querySelectorAll('span,font')].forEach((element) => {
          const formats = [];
          const weight = element.style?.fontWeight || '';
          if (weight === 'bold' || Number.parseInt(weight, 10) >= 600) formats.push('b');
          if (element.style?.fontStyle === 'italic') formats.push('i');
          const decoration = `${element.style?.textDecoration || ''} ${element.style?.textDecorationLine || ''}`;
          if (/underline/i.test(decoration)) formats.push('u');
          if (/line-through/i.test(decoration)) formats.push('s');

          if (!formats.length) {
            element.replaceWith(...element.childNodes);
            return;
          }

          let replacement = document.createDocumentFragment();
          while (element.firstChild) replacement.appendChild(element.firstChild);
          formats.slice().reverse().forEach((tagName) => {
            const wrapper = document.createElement(tagName);
            wrapper.appendChild(replacement);
            replacement = wrapper;
          });
          element.replaceWith(replacement);
        });

        [...container.querySelectorAll('b,i,u,s')].forEach((element) => {
          [...element.attributes].forEach((attribute) => element.removeAttribute(attribute.name));
        });
      };

      const normalizeClipboardLinks = (container) => {
        [...container.querySelectorAll('a')].forEach((anchor) => {
          const source = String(anchor.getAttribute('href') || '').trim();
          let href = '';
          try {
            const resolved = new URL(source, document.baseURI);
            if (resolved.protocol === 'http:' || resolved.protocol === 'https:') href = resolved.href;
          } catch (error) {
            href = '';
          }

          if (!href) {
            anchor.replaceWith(...anchor.childNodes);
            return;
          }

          const linkedSegment = (node, formats) => {
            const cleanAnchor = document.createElement('a');
            cleanAnchor.setAttribute('href', href);
            cleanAnchor.appendChild(node);
            let replacement = cleanAnchor;
            formats.slice().reverse().forEach((tagName) => {
              const wrapper = document.createElement(tagName);
              wrapper.appendChild(replacement);
              replacement = wrapper;
            });
            return replacement;
          };

          const appendSegments = (node, formats, destination) => {
            if (node.nodeType === Node.TEXT_NODE) {
              if (node.nodeValue) destination.appendChild(linkedSegment(node.cloneNode(), formats));
              return;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return;

            const tagName = node.tagName.toLowerCase();
            if (['b', 'i', 'u', 's'].includes(tagName)) {
              [...node.childNodes].forEach((child) => appendSegments(child, [...formats, tagName], destination));
              return;
            }

            if (!node.childNodes.length) {
              destination.appendChild(linkedSegment(node.cloneNode(true), formats));
              return;
            }

            const shell = node.cloneNode(false);
            [...node.childNodes].forEach((child) => appendSegments(child, formats, shell));
            destination.appendChild(shell);
          };

          const replacement = document.createDocumentFragment();
          [...anchor.childNodes].forEach((child) => appendSegments(child, [], replacement));
          anchor.replaceWith(replacement);
        });
      };

      const applyClipboardTableStyles = (container) => {
        [...container.querySelectorAll('table')].forEach((table) => {
          table.setAttribute('border', '1');
          table.setAttribute('cellspacing', '0');
          table.setAttribute('cellpadding', '0');
          table.style.width = '100%';
          table.style.border = '1px solid #9ca3af';
          table.style.borderCollapse = 'collapse';
          table.style.tableLayout = 'fixed';

          [...table.querySelectorAll('th,td')].forEach((cell) => {
            cell.style.border = '1px solid #9ca3af';
            cell.style.padding = '8px 10px';
            cell.style.textAlign = cell.style.textAlign || 'left';
            cell.style.verticalAlign = 'top';
            if (cell.tagName === 'TH') {
              cell.style.background = '#f1f5f9';
              cell.style.fontWeight = '700';
            }
          });
        });
      };

      // contenteditable 표 셀은 커서를 놓기 위해 마지막에 <br> 또는 빈 <div>를
      // 남길 수 있습니다. 편집기에서는 높이를 늘리지 않는 자리표시지만 네이버
      // SmartEditor ONE은 이를 실제 빈 문단으로 가져옵니다. 셀 중간의 빈 줄은
      // 유지하고 맨 끝에 연속된 빈 줄만 클립보드 사본에서 제거합니다.
      const trimTrailingClipboardCellBlanks = (container) => {
        const isBlankLineElement = (node) => {
          if (node.nodeType !== Node.ELEMENT_NODE) return false;
          if (node.tagName === 'BR') return true;
          if (!['DIV', 'P'].includes(node.tagName)) return false;
          const text = node.textContent.replace(/\u00A0/g, ' ').trim();
          const hasVisibleContent = Boolean(node.querySelector(
            'img,hr,table,iframe,video,audio,canvas,svg'
          ));
          return !text && !hasVisibleContent;
        };

        [...container.querySelectorAll('td,th')].forEach((cell) => {
          for (;;) {
            const last = cell.lastChild;
            if (!last) break;
            if (last.nodeType === Node.TEXT_NODE && /^[\t\r\n]*$/.test(last.nodeValue || '')) {
              last.remove();
              continue;
            }
            if (!isBlankLineElement(last)) break;
            last.remove();
          }
          if (!cell.childNodes.length) cell.appendChild(document.createTextNode('\u00A0'));
        });
      };

      const canonicalizeClipboardParagraphs = (container) => {
        const commentWalker = document.createTreeWalker(container, NodeFilter.SHOW_COMMENT);
        const comments = [];
        while (commentWalker.nextNode()) comments.push(commentWalker.currentNode);
        comments.forEach((node) => node.remove());

        [...container.querySelectorAll('p')].forEach((paragraph) => {
          const line = document.createElement('div');
          [...paragraph.attributes].forEach((attribute) => {
            line.setAttribute(attribute.name, attribute.value);
          });
          while (paragraph.firstChild) line.appendChild(paragraph.firstChild);
          if (!line.textContent
            && !line.querySelector('img,hr,table,iframe,video,audio,canvas,svg')
            && !line.querySelector('br')) {
            line.appendChild(document.createTextNode('\u00A0'));
          }
          paragraph.replaceWith(line);
        });

        const structuralTags = new Set([
          'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'PRE',
          'UL', 'OL', 'TABLE', 'HR'
        ]);
        [...container.querySelectorAll('div')].reverse().forEach((wrapper) => {
          if (wrapper.attributes.length) return;
          const meaningfulChildren = [...wrapper.childNodes].filter((node) => (
            node.nodeType === Node.ELEMENT_NODE
            || (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim())
          ));
          if (!meaningfulChildren.length
            || !meaningfulChildren.every((node) => (
              node.nodeType === Node.ELEMENT_NODE && structuralTags.has(node.tagName)
            ))) return;
          wrapper.replaceWith(...wrapper.childNodes);
        });

        [...container.querySelectorAll('div')].forEach((line) => {
          if (line.textContent
            || line.querySelector('img,hr,table,iframe,video,audio,canvas,svg,br')
            || [...line.children].some((child) => structuralTags.has(child.tagName))) return;
          line.appendChild(document.createTextNode('\u00A0'));
        });
      };

      const INLINE_COPY_TAGS = new Set([
        'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'A', 'CODE', 'SPAN', 'FONT'
      ]);

      // Range.cloneContents는 범위를 감싸고 있는 조상 태그를 포함하지 않습니다.
      // 그래서 굵은 단어의 일부만 선택해 복사하면 굵게가 사라졌습니다.
      // 빠진 인라인 서식 조상을 안쪽부터 다시 씌웁니다.
      const restoreInlineAncestors = (container, range) => {
        const chain = [];
        let element = range.commonAncestorContainer;
        if (element && element.nodeType !== Node.ELEMENT_NODE) element = element.parentElement;
        for (; element && element !== editor && editor.contains(element); element = element.parentElement) {
          if (INLINE_COPY_TAGS.has(element.tagName)) chain.push(element);
        }
        chain.forEach((source) => {
          const wrapper = source.cloneNode(false);
          while (container.firstChild) wrapper.appendChild(container.firstChild);
          container.appendChild(wrapper);
        });
      };

      // 인용구 안의 글자만 드래그해 복사해도 Range에는 바깥 blockquote가 들어오지
      // 않습니다. 선택이 한 인용구 안에만 있으면 블록 조상도 복원합니다.
      const restoreQuoteAncestor = (container, range) => {
        if (container.querySelector('blockquote')) return;
        let element = range.commonAncestorContainer;
        if (element && element.nodeType !== Node.ELEMENT_NODE) element = element.parentElement;
        const quote = element?.closest?.('blockquote');
        if (!quote || !editor.contains(quote)) return;
        const wrapper = quote.cloneNode(false);
        while (container.firstChild) wrapper.appendChild(container.firstChild);
        container.appendChild(wrapper);
      };

      const clipboardHtmlWithExplicitBreaks = (range) => {
        const container = document.createElement('div');
        container.appendChild(range.cloneContents());
        restoreInlineAncestors(container, range);
        restoreQuoteAncestor(container, range);
        const clipboardBlockTags = new Set([
          'P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'PRE',
          'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TD', 'TH', 'HR'
        ]);
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        const newlineNodes = [];
        while (walker.nextNode()) {
          if (/\r|\n/.test(walker.currentNode.nodeValue || '')) newlineNodes.push(walker.currentNode);
        }

        newlineNodes.forEach((node) => {
          const parts = String(node.nodeValue || '').replace(/\r\n?/g, '\n').split('\n');
          const fragment = document.createDocumentFragment();
          parts.forEach((part, index) => {
            if (part) fragment.appendChild(document.createTextNode(part));
            if (index < parts.length - 1) fragment.appendChild(document.createElement('br'));
          });
          node.replaceWith(fragment);
        });

        const wrapped = document.createDocumentFragment();
        let inlineRun = null;
        [...container.childNodes].forEach((node) => {
          const isBlock = node.nodeType === Node.ELEMENT_NODE && clipboardBlockTags.has(node.tagName);
          if (isBlock) {
            inlineRun = null;
            wrapped.appendChild(node);
            return;
          }
          if (!inlineRun) {
            inlineRun = document.createElement('div');
            wrapped.appendChild(inlineRun);
          }
          inlineRun.appendChild(node);
        });
        container.replaceChildren(wrapped);

        const breakParts = (element) => {
          const breaks = [...element.querySelectorAll('br')];
          if (!breaks.length) return [];
          const parts = [];
          let startContainer = element;
          let startOffset = 0;
          breaks.forEach((lineBreak) => {
            const partRange = document.createRange();
            partRange.setStart(startContainer, startOffset);
            partRange.setEndBefore(lineBreak);
            parts.push(partRange.cloneContents());
            startContainer = lineBreak.parentNode;
            startOffset = [...startContainer.childNodes].indexOf(lineBreak) + 1;
          });
          const lastRange = document.createRange();
          lastRange.setStart(startContainer, startOffset);
          lastRange.setEnd(element, element.childNodes.length);
          parts.push(lastRange.cloneContents());
          return parts;
        };

        const appendPart = (line, part) => {
          const hasContent = Boolean(part.textContent)
            || Boolean(part.querySelector?.('img,hr,table,iframe,video,audio,canvas,svg'));
          if (hasContent) line.appendChild(part);
          else line.appendChild(document.createTextNode('\u00A0'));
        };

        const splitCandidates = [...container.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,blockquote,pre')]
          .filter((element) => ![...element.children].some((child) => clipboardBlockTags.has(child.tagName)));
        splitCandidates.forEach((element) => {
          const parts = breakParts(element);
          if (!parts.length) return;
          const replacement = document.createDocumentFragment();
          if (!element.textContent && parts.every((part) => !part.textContent)) {
            const blankLine = document.createElement('div');
            blankLine.appendChild(document.createTextNode('\u00A0'));
            replacement.appendChild(blankLine);
          } else {
            parts.forEach((part) => {
              const lineTag = ['P', 'DIV'].includes(element.tagName) ? 'div' : element.tagName.toLowerCase();
              const line = document.createElement(lineTag);
              [...element.attributes].forEach((attribute) => line.setAttribute(attribute.name, attribute.value));
              appendPart(line, part);
              replacement.appendChild(line);
            });
          }
          element.replaceWith(replacement);
        });

        [...container.querySelectorAll('li,td,th')].forEach((element) => {
          if (element.querySelector('ul,ol,table')) return;
          const parts = breakParts(element);
          if (!parts.length) return;
          element.replaceChildren();
          if ((element.tagName === 'TD' || element.tagName === 'TH')
            && !element.textContent
            && parts.every((part) => !part.textContent && !part.querySelector?.('img,hr,table,iframe,video,audio,canvas,svg'))) {
            element.appendChild(document.createTextNode('\u00A0'));
            return;
          }
          parts.forEach((part) => {
            const line = document.createElement('div');
            appendPart(line, part);
            element.appendChild(line);
          });
        });

        // HTML의 일반 공백은 받는 편집기가 white-space: normal로 해석하면 여러
        // 칸을 한 칸으로 접습니다. 에디터 안의 원고는 그대로 두고, 클립보드용
        // HTML에서 연속된 일반 공백만 NBSP로 바꿔 네이버 카페 같은 외부
        // 편집기에서도 입력한 칸 수가 유지되게 합니다. 인라인 서식 경계 양쪽에
        // 나뉜 공백도 한 덩어리로 계산합니다.
        const preserveRepeatedSpaces = (root) => {
          const blockTags = new Set([
            'P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
            'BLOCKQUOTE', 'PRE', 'LI', 'TD', 'TH'
          ]);
          const replacements = new Map();
          let run = [];

          const flush = () => {
            if (run.length > 1) {
              run.forEach(({ node, offset }) => {
                if (!replacements.has(node)) replacements.set(node, new Set());
                replacements.get(node).add(offset);
              });
            }
            run = [];
          };

          const visit = (node, insideBlock = false) => {
            if (node.nodeType === Node.TEXT_NODE) {
              if (!insideBlock) {
                flush();
                return;
              }
              for (let offset = 0; offset < node.nodeValue.length; offset += 1) {
                if (node.nodeValue[offset] === ' ') run.push({ node, offset });
                else flush();
              }
              return;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return;
            if (node.tagName === 'BR') {
              flush();
              return;
            }
            const isBlock = blockTags.has(node.tagName);
            if (isBlock) flush();
            [...node.childNodes].forEach((child) => visit(child, insideBlock || isBlock));
            if (isBlock) flush();
          };

          [...root.childNodes].forEach((node) => visit(node));
          flush();
          replacements.forEach((offsets, node) => {
            node.nodeValue = node.nodeValue
              .split('')
              .map((character, offset) => offsets.has(offset) ? '\u00A0' : character)
              .join('');
          });
        };

        normalizeClipboardFormatting(container);
        normalizeClipboardLinks(container);
        canonicalizeClipboardParagraphs(container);
        trimTrailingClipboardCellBlanks(container);
        applyClipboardTableStyles(container);
        preserveRepeatedSpaces(container);
        return sanitizeHtml(container.innerHTML);
      };

      const naverClipboardId = () => {
        const value = typeof crypto.randomUUID === 'function'
          ? crypto.randomUUID()
          : `${Date.now().toString(16)}-${Math.random().toString(16).slice(2)}`;
        return `SE-${value}`;
      };

      // SmartEditor ONE은 인용구를 일반 blockquote가 아니라 se-quotation 컴포넌트
      // 구조로 구분합니다. 표준 blockquote는 편집기와 저장 파일에 그대로 두고,
      // 외부로 복사하는 HTML에서만 네이버가 인용구로 알아볼 수 있는 구조를
      // 추가합니다. 네이버가 클래스를 해석하지 않는 환경에서도 인용 모양은
      // 유지되도록 최소한의 인라인 스타일을 함께 둡니다.
      const naverQuoteClipboardHtml = (html) => {
        const doc = new DOMParser().parseFromString(String(html), 'text/html');
        [...doc.body.querySelectorAll('blockquote')].forEach((source) => {
          if (source.closest('.se-quotation')) return;

          const component = doc.createElement('div');
          component.className = 'se-component se-quotation se-l-quotation_line';
          component.id = naverClipboardId();
          component.style.cssText = 'margin:20px 0;position:relative';

          const content = doc.createElement('div');
          content.className = 'se-component-content';
          content.style.cssText = 'max-width:800px;margin:0 auto';

          const section = doc.createElement('div');
          section.className = 'se-section se-section-quotation se-l-quotation_line';
          section.style.cssText = 'margin:0 auto;padding:10px 0';

          const quotation = doc.createElement('blockquote');
          quotation.className = 'se-quotation-container';
          quotation.style.cssText = 'box-sizing:border-box;margin:auto;padding:8px 16px;border:0;border-left:4px solid #94a3b8;quotes:none';

          const module = doc.createElement('div');
          module.className = 'se-module se-module-text se-quote';

          const appendParagraph = (nodes) => {
            const paragraph = doc.createElement('p');
            paragraph.className = 'se-text-paragraph se-text-paragraph-align-';
            paragraph.id = naverClipboardId();
            paragraph.style.cssText = 'margin:0;line-height:1.8;word-break:break-word;overflow-wrap:break-word;white-space:pre-wrap';
            const span = doc.createElement('span');
            span.className = 'se-fs-fs16 se-ff-';
            span.id = naverClipboardId();
            span.style.cssText = 'font-size:16px;line-height:inherit';
            nodes.forEach((node) => span.appendChild(node));
            if (!span.childNodes.length) span.appendChild(doc.createElement('br'));
            paragraph.appendChild(span);
            module.appendChild(paragraph);
          };

          const directBlocks = [...source.children].filter((child) => (
            ['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(child.tagName)
          ));
          if (directBlocks.length && directBlocks.length === source.children.length) {
            directBlocks.forEach((block) => {
              appendParagraph([...block.childNodes]);
              block.remove();
            });
          } else {
            appendParagraph([...source.childNodes]);
          }

          quotation.appendChild(module);
          section.appendChild(quotation);
          content.appendChild(section);
          component.appendChild(content);
          source.replaceWith(component);
        });
        return doc.body.innerHTML;
      };

      // <br>은 문단 나눔이 아니라 문단 안의 줄바꿈이므로 따로 표시해 둡니다.
      const CLIPBOARD_SOFT_BREAK = '\u0001';

      // 붙여넣기에서 유지하는 인라인 서식입니다. 글꼴·글자 크기·색처럼 문서
      // 전체 모양을 흔드는 외부 서식은 가져오지 않습니다.
      const EMPTY_CLIPBOARD_STYLE = {
        bold: false, italic: false, underline: false, strike: false, href: ''
      };

      const sameClipboardStyle = (left, right) => left.bold === right.bold
        && left.italic === right.italic
        && left.underline === right.underline
        && left.strike === right.strike
        && left.href === right.href;

      const clipboardLinkHref = (element) => {
        const source = String(element.getAttribute('href') || '').trim();
        if (!source) return '';
        try {
          const resolved = new URL(source, document.baseURI);
          return SAFE_URL_SCHEMES.has(resolved.protocol) ? resolved.href : '';
        } catch (error) {
          return '';
        }
      };

      // 인라인 스타일로 명시된 값을 돌려줍니다. 지정이 없으면 null입니다.
      const explicitInheritedStyleState = (element, format) => {
        const style = element.style;
        if (!style) return null;
        if (format === 'bold') {
          const weight = String(style.fontWeight || '');
          if (!weight) return null;
          return weight === 'bold' || Number.parseInt(weight, 10) >= 600;
        }
        const fontStyle = String(style.fontStyle || '');
        if (!fontStyle) return null;
        return fontStyle === 'italic' || fontStyle === 'oblique';
      };

      // 굵게·기울임은 상속되는 속성이므로 가장 가까운 명시적 지정이 이깁니다.
      // Google 문서는 <b style="font-weight:normal"> 래퍼로 문서 전체를 감싸기
      // 때문에, 태그만 보고 판정하면 붙여넣은 글이 전부 굵어집니다.
      const resolveInheritedFormat = (node, root, format) => {
        for (let element = node.parentNode; element && element !== root; element = element.parentNode) {
          if (element.nodeType !== Node.ELEMENT_NODE) continue;
          const explicit = explicitInheritedStyleState(element, format);
          if (explicit !== null) return explicit;
          if (element.matches(FORMAT_DEFINITIONS[format].selector)) return true;
        }
        return false;
      };

      // 밑줄·취소선은 상속이 아니라 조상에 그려지는 장식이라, 자손에서 none으로
      // 되돌릴 수 없습니다. 그래서 하나라도 있으면 적용된 것으로 봅니다.
      const hasDecorationFormat = (node, root, format) => {
        for (let element = node.parentNode; element && element !== root; element = element.parentNode) {
          if (element.nodeType !== Node.ELEMENT_NODE) continue;
          if (elementCarriesFormat(element, format)) return true;
        }
        return false;
      };

      const clipboardStyleAt = (node, root) => {
        const style = { ...EMPTY_CLIPBOARD_STYLE };
        style.bold = resolveInheritedFormat(node, root, 'bold');
        style.italic = resolveInheritedFormat(node, root, 'italic');
        style.underline = hasDecorationFormat(node, root, 'underline');
        style.strike = hasDecorationFormat(node, root, 'strikeThrough');
        for (let element = node.parentNode; element && element !== root; element = element.parentNode) {
          if (element.nodeType === Node.ELEMENT_NODE && element.tagName === 'A') {
            style.href = clipboardLinkHref(element);
            if (style.href) break;
          }
        }
        return style;
      };

      // 서식 표식으로 쓸 사용자 영역 문자입니다. 공백이 아니므로 innerText의
      // 공백 정리에 사라지지 않고, 글자와 같은 자리에 남습니다.
      const CLIPBOARD_MARK_BASE = 0xE300;
      const CLIPBOARD_MARK_LIMIT = 240;

      // 사용자 영역(PUA)은 글꼴 아이콘이나 일부 이모지 세트가 실제로 쓰는
      // 구간입니다. 원고에 그런 문자가 들어 있으면 표식으로 오해해 글자가
      // 그대로 사라졌습니다. 그래서 원고의 해당 문자 앞에는 이 escape 문자를
      // 붙여 표식과 구분하고, 읽는 쪽에서 escape를 떼어 원래 글자를 살립니다.
      const CLIPBOARD_MARK_ESCAPE = 0xE2FF;
      const CLIPBOARD_RESERVED_PATTERN = new RegExp(
        `[\\u${CLIPBOARD_MARK_ESCAPE.toString(16)}-\\u${(CLIPBOARD_MARK_BASE + CLIPBOARD_MARK_LIMIT - 1).toString(16)}]`,
        'g'
      );

      const escapeClipboardReserved = (value) => String(value)
        .replace(CLIPBOARD_RESERVED_PATTERN, (character) => String.fromCharCode(CLIPBOARD_MARK_ESCAPE) + character);

      const clipboardRunsFromMarkedText = (segment, styles) => {
        const runs = [];
        let style = EMPTY_CLIPBOARD_STYLE;
        let buffer = '';
        const flush = () => {
          if (!buffer) return;
          // 서식이 같은 이웃 구간은 하나로 합칩니다. 나누어 두면 붙여넣을 때
          // <b>가</b><b>나</b> 처럼 껍데기가 여러 개 생깁니다.
          const last = runs[runs.length - 1];
          if (last && sameClipboardStyle(last, style)) last.text += buffer;
          else runs.push({ ...style, text: buffer });
          buffer = '';
        };

        // 서로게이트 쌍은 코드 단위로 나눠 담아도 buffer에서 다시 이어집니다.
        for (let index = 0; index < segment.length; index += 1) {
          const character = segment[index];
          const code = character.charCodeAt(0);
          if (code === CLIPBOARD_MARK_ESCAPE) {
            // escape 다음 글자는 표식이 아니라 원고의 글자입니다.
            const escaped = segment[index + 1];
            if (escaped !== undefined) {
              buffer += escaped;
              index += 1;
            }
            continue;
          }
          if (code >= CLIPBOARD_MARK_BASE && code < CLIPBOARD_MARK_BASE + CLIPBOARD_MARK_LIMIT) {
            flush();
            style = styles[code - CLIPBOARD_MARK_BASE] || EMPTY_CLIPBOARD_STYLE;
            continue;
          }
          buffer += character;
        }
        flush();
        return finalizeClipboardRuns(runs, true);
      };

      // 한 줄의 구간 목록을 다듬습니다.
      //  - trimEdges: 표식 문자가 공백이 아니어서 블록 앞뒤 공백이 innerText에서
      //    지워지지 않고 남습니다. 브라우저가 화면에서도 지우는 공백이므로 맞춥니다.
      //  - 서식이 있는 구간의 양 끝 공백은 서식 밖으로 뺍니다. 밑줄·취소선·링크는
      //    공백에도 선이 그려져 "밑줄 "처럼 눈에 보입니다.
      //  - 줄바꿈 없는 공백(&nbsp;)은 눈에 보이는 글자이므로 일반 공백으로 남깁니다.
      const finalizeClipboardRuns = (runs, trimEdges) => {
        const working = [...runs];
        if (trimEdges) {
          while (working.length) {
            working[0].text = working[0].text.replace(/^[ \t\n\r]+/, '');
            if (working[0].text) break;
            working.shift();
          }
          while (working.length) {
            const last = working[working.length - 1];
            last.text = last.text.replace(/[ \t\n\r]+$/, '');
            if (last.text) break;
            working.pop();
          }
        }
        working.forEach((run) => { run.text = run.text.replace(/\u00A0/g, ' '); });

        const spaced = [];
        const push = (style, text) => {
          if (!text) return;
          const last = spaced[spaced.length - 1];
          if (last && sameClipboardStyle(last, style)) last.text += text;
          else spaced.push({ ...style, text });
        };
        working.forEach((run) => {
          const styled = run.bold || run.italic || run.underline || run.strike || run.href;
          const parts = run.text.match(/^(\s*)([\s\S]*?)(\s*)$/);
          if (!styled || !parts || !parts[2]) {
            push(run, run.text);
            return;
          }
          push(EMPTY_CLIPBOARD_STYLE, parts[1]);
          push(run, parts[2]);
          push(EMPTY_CLIPBOARD_STYLE, parts[3]);
        });

        // 공백만 남은 줄은 빈 줄로 봅니다. 그대로 두면 줄 앞에 공백이 생깁니다.
        return spaced.some((run) => run.text.trim()) ? spaced : [];
      };

      // 줄 구조는 평문(text/plain)을 따르고, 서식만 HTML에서 가져와 같은 글자에
      // 얹습니다.
      //
      // HTML 블록만 보고 줄을 세면 문단 사이의 빈 줄이 사라집니다. 채팅 화면에서
      // 복사하면 평문에는 문단 사이에 빈 줄이 있는데 HTML에는 <p>가 두 개만 있기
      // 때문입니다. 그러면 Ctrl+Shift+V로는 빈 줄이 남고 Ctrl+V로는 사라져
      // 두 동작이 어긋납니다.
      //
      // 두 표현의 "공백을 뺀 글자"가 정확히 같을 때만 겹칩니다. 다르면 글자와
      // 서식이 밀려 엉뚱한 곳이 굵어질 수 있으므로 HTML 구조를 그대로 씁니다.
      const alignClipboardLinesToPlainText = (plain, htmlLines) => {
        const flat = [];
        htmlLines.forEach((line) => line.forEach((runs) => runs.forEach((run) => {
          for (const character of run.text) flat.push({ character, style: run });
        })));
        const withoutSpaces = (value) => value.replace(/\s/g, '');
        const htmlCompact = withoutSpaces(flat.map((item) => item.character).join(''));
        if (!htmlCompact) return null;
        const text = normalizeClipboardText(plain);
        if (withoutSpaces(text) !== htmlCompact) return null;

        let cursor = 0;
        const takeStyle = () => {
          while (cursor < flat.length && /\s/.test(flat[cursor].character)) cursor += 1;
          if (cursor >= flat.length) return EMPTY_CLIPBOARD_STYLE;
          const style = flat[cursor].style;
          cursor += 1;
          return style;
        };

        return text.split('\n').map((line) => {
          const runs = [];
          let last = EMPTY_CLIPBOARD_STYLE;
          line.split('').forEach((character) => {
            // 공백은 앞 글자의 서식을 따라가되, 구간 끝 공백은 아래 다듬기에서
            // 서식 밖으로 빠집니다.
            const style = /\s/.test(character) ? last : takeStyle();
            last = style;
            const tail = runs[runs.length - 1];
            if (tail && sameClipboardStyle(tail, style)) tail.text += character;
            else runs.push({ ...style, text: character });
          });
          // 평문에는 문단 안 줄바꿈이 따로 없으므로 한 줄은 한 구간뿐입니다.
          return [finalizeClipboardRuns(runs, false)];
        });
      };

      const clipboardSegmentText = (runs) => runs.map((run) => run.text).join('');

      // 클립보드 HTML을 "문단 배열 안의 줄 배열"로 바꿉니다. 각 줄은 서식이 같은
      // 구간(run)의 배열입니다.
      // innerText는 <p>를 두 줄로 계산하기 때문에(마진과 무관한 규격상 동작)
      // <div>로 바꿔 눈에 보이는 줄과 개행 수를 1:1로 맞춥니다. 이 계산은 그대로
      // 두고, 서식은 각 텍스트 노드 앞에 표식 문자를 붙여 함께 실어 보냅니다.
      const clipboardLinesFromHtml = (html) => {
        const doc = new DOMParser().parseFromString(String(html), 'text/html');
        doc.body.querySelectorAll('br').forEach((lineBreak) => {
          // 빈 블록의 <br>은 줄바꿈이 아니라 커서를 놓기 위한 자리표시입니다.
          // 줄바꿈으로 세면 빈 줄 하나가 두 줄로 늘어납니다.
          const parent = lineBreak.parentElement;
          if (parent && !parent.textContent.trim() && parent.querySelectorAll('br').length === 1) {
            lineBreak.remove();
            return;
          }
          lineBreak.replaceWith(doc.createTextNode(CLIPBOARD_SOFT_BREAK));
        });
        doc.body.querySelectorAll('p').forEach((paragraph) => {
          const line = doc.createElement('div');
          [...paragraph.attributes].forEach((attribute) => line.setAttribute(attribute.name, attribute.value));
          while (paragraph.firstChild) line.appendChild(paragraph.firstChild);
          if (!line.childNodes.length) line.appendChild(doc.createTextNode('\u00A0'));
          paragraph.replaceWith(line);
        });

        doc.body.querySelectorAll('img, svg, video, audio, iframe').forEach((el) => el.remove());

        const styles = [];
        const textNodes = [];
        const styleWalker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
        while (styleWalker.nextNode()) textNodes.push(styleWalker.currentNode);
        textNodes.forEach((node) => {
          // 공백만 있는 노드에는 표식을 붙이지 않습니다. 표식은 공백이 아니므로
          // 붙이면 innerText가 그 노드를 지우지 못하고, 태그 사이 개행·들여쓰기가
          // (Word나 손으로 정리한 HTML에 흔합니다) 전부 빈 줄로 늘어납니다.
          if (!node.nodeValue || !node.nodeValue.trim()) return;
          const style = clipboardStyleAt(node, doc.body);
          let index = styles.findIndex((item) => sameClipboardStyle(item, style));
          if (index < 0) {
            if (styles.length >= CLIPBOARD_MARK_LIMIT) {
              // 표식을 못 붙이면 서식은 잃지만 글자는 남겨야 합니다.
              node.nodeValue = escapeClipboardReserved(node.nodeValue);
              return;
            }
            styles.push(style);
            index = styles.length - 1;
          }
          node.nodeValue = String.fromCharCode(CLIPBOARD_MARK_BASE + index)
            + escapeClipboardReserved(node.nodeValue);
        });

        const host = document.createElement('div');
        host.setAttribute('aria-hidden', 'true');
        host.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;pointer-events:none';
        document.body.appendChild(host);
        let measured = '';
        try {
          host.innerHTML = sanitizeHtml(doc.body.innerHTML);
          measured = host.innerText;
        } finally {
          // 예외가 나도 측정용 숨은 노드가 문서에 남지 않게 합니다.
          host.remove();
        }

        return normalizeClipboardText(measured).split('\n').map((line) => line
          .split(CLIPBOARD_SOFT_BREAK)
          .map((segment) => clipboardRunsFromMarkedText(segment, styles)));
      };

      const clipboardPlainTextFromHtml = (html) => clipboardLinesFromHtml(html)
        .map((line) => line.map(clipboardSegmentText).join('\n'))
        .join('\n');

      const writeEditorClipboardData = (event) => {
        const selection = window.getSelection();
        if (!event.clipboardData || !selection || selection.isCollapsed || !selectionIsInsideEditor()) return false;
        const range = selection.getRangeAt(0);
        const standardHtml = clipboardHtmlWithExplicitBreaks(range);
        // text/html은 이미 "블록 하나 = 한 줄"로 정규화돼 있으므로
        // text/plain도 같은 구조에서 뽑아 두 형식의 줄 수를 일치시킵니다.
        const plain = clipboardPlainTextFromHtml(standardHtml);
        const html = naverQuoteClipboardHtml(standardHtml);

        event.preventDefault();
        event.clipboardData.setData('text/plain', plain);
        event.clipboardData.setData('text/html', html);
        return true;
      };

      const handleEditorCopy = (event) => {
        writeEditorClipboardData(event);
      };

      // 잘라내기를 브라우저 기본 동작에 맡기면 정규화를 전부 건너뛰기 때문에
      // 다른 프로그램에 붙여넣을 때 문단 사이에 빈 줄이 하나씩 더 생깁니다.
      // 그래서 복사와 똑같은 형식으로 기록한 뒤 선택 영역을 직접 지웁니다.
      const handleEditorCut = (event) => {
        if (!writeEditorClipboardData(event)) return;
        // 되돌리기(Ctrl+Z) 기록에 남도록 execCommand로 지웁니다.
        if (!document.execCommand('delete', false, null)) {
          const selection = window.getSelection();
          if (selection && selection.rangeCount) selection.getRangeAt(0).deleteContents();
        }
        normalizeEmptyDocument();
        updateCount();
        updateFormattingControlsState();
      };

      const copyAllRich = () => {
        focusEditor();
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(editor);
        selection.removeAllRanges();
        selection.addRange(range);
        const success = document.execCommand('copy');
        selection.removeAllRanges();
        showToast(success ? '문서 전체를 서식 있게 복사했습니다.' : '복사하지 못했습니다. 편집 영역에서 Ctrl+A, Ctrl+C를 사용하세요.');
      };

      const openFindbar = (withReplace) => {
        hideSelectionToolbar();
        findbarReplaceMode = Boolean(withReplace);
        const selection = window.getSelection();
        const selectedText = withReplace
          && selection
          && !selection.isCollapsed
          && selectionIsInsideEditor()
            ? selection.toString()
            : '';

        if (selectedText) {
          savedRange = selection.getRangeAt(0).cloneRange();
          findText.value = selectedText;
        }
        if (withReplace) resetReplacementFormatStates();
        findbar.classList.add('open');
        replaceRow.style.display = withReplace ? 'grid' : 'none';
        particleOption.style.display = withReplace ? 'flex' : 'none';
        replaceFormats.style.display = withReplace ? 'flex' : 'none';
        replaceFormatHint.style.display = withReplace ? 'block' : 'none';
        // 찾기 전용(Ctrl+F)에는 바꿀 내용 칸이 없으므로 바꾸기 버튼도 둘 자리가
        // 없습니다. 숨기는 대신 문서에서 떼어 냅니다. 남겨 두면 화면에 보이지
        // 않으면서도 클릭·포커스·보조기술 탐색으로 닿을 수 있고, 빈 칸을 바꿀
        // 내용으로 읽어 찾은 글자를 조용히 지웁니다.
        if (withReplace) replaceOnlyButtons.forEach((button) => findActions.appendChild(button));
        else replaceOnlyButtons.forEach((button) => button.remove());
        updateReplacementFormatPreview();
        updateFindCount();
        findText.focus();
        findText.select();
      };

      const closeFindbar = () => {
        findbar.classList.remove('open');
        cancelScheduledFindCount();
        clearFindHighlight();
        findCount.textContent = '';
        findCount.classList.remove('is-empty');
        focusEditor();
      };

      // 문단·줄바꿈은 검색 모델 안에서 한 글자짜리 표식이 필요합니다. 고정된
      // U+E000·U+E001을 쓰면 원고에 같은 사용자 영역 문자가 있을 때 실제 글자를
      // ^p·^l로 오인합니다. 현재 문서와 찾기/바꾸기 문자열에 없는 문자를 매번
      // 골라 구조 표식과 원고 글자가 절대 겹치지 않게 합니다.
      const pickSpecialSearchMarkers = (root = editor, sources = []) => {
        const occupied = new Set([...(root.textContent || ''), ...sources.join('')]);
        const available = [];
        for (let code = 0xE000; code <= 0xF8FF && available.length < 2; code += 1) {
          const character = String.fromCharCode(code);
          if (!occupied.has(character)) available.push(character);
        }
        // 사용자 영역 전체가 들어 있는 극단적인 문서도 처리할 수 있도록 나머지
        // BMP에서 원고에 없는 글자를 찾습니다. 서로게이트와 줄 구조 문자는 뺍니다.
        for (let code = 1; code <= 0xFFFF && available.length < 2; code += 1) {
          if ([9, 10, 13].includes(code) || (code >= 0xD800 && code <= 0xDFFF)) continue;
          const character = String.fromCharCode(code);
          if (!occupied.has(character) && !available.includes(character)) available.push(character);
        }
        if (available.length < 2) throw new Error('검색용 구조 표식을 만들 수 없습니다.');
        return { paragraph: available[0], line: available[1] };
      };

      const parseSpecialCodes = (source, markers) => {
        const tokens = [];
        let text = '';
        let buffer = '';
        let usesCodes = false;

        const flushText = () => {
          if (!buffer) return;
          tokens.push({ type: 'text', value: buffer });
          text += buffer;
          buffer = '';
        };

        for (let index = 0; index < source.length; index += 1) {
          const character = source[index];
          const code = source[index + 1]?.toLowerCase();
          if (character !== '^' || !['^', 'p', 'l', 't'].includes(code)) {
            buffer += character;
            continue;
          }

          usesCodes = true;
          index += 1;
          if (code === '^') {
            buffer += '^';
          } else {
            flushText();
            if (code === 'p') {
              tokens.push({ type: 'paragraph' });
              text += markers.paragraph;
            } else if (code === 'l') {
              tokens.push({ type: 'line' });
              text += markers.line;
            } else {
              tokens.push({ type: 'tab' });
              text += '\t';
            }
          }
        }
        flushText();
        return { text, tokens, usesCodes };
      };

      // root는 편집기 본체이거나, 일괄 편집용으로 분리해 둔 복제본입니다.
      const getParagraphUnits = (root = editor) => {
        const units = [];
        [...root.childNodes].forEach((node) => {
          if (node.nodeType === Node.ELEMENT_NODE && ['UL', 'OL'].includes(node.tagName)) {
            [...node.children].filter((child) => child.tagName === 'LI').forEach((item) => units.push(item));
          } else if (node.nodeType === Node.ELEMENT_NODE || (node.nodeType === Node.TEXT_NODE && node.nodeValue)) {
            units.push(node);
          }
        });
        return units;
      };

      const getNodePoint = (node, atEnd) => {
        const range = document.createRange();
        range.selectNodeContents(node);
        range.collapse(!atEnd);
        return {
          node: range.startContainer,
          offset: range.startOffset
        };
      };

      const buildSpecialSearchModel = (root = editor, markers = pickSpecialSearchMarkers(root)) => {
        const units = getParagraphUnits(root);
        const items = [];

        const addTextNode = (node) => {
          for (let offset = 0; offset < node.nodeValue.length; offset += 1) {
            const character = node.nodeValue[offset] === '\n' ? markers.line : node.nodeValue[offset];
            items.push({
              character,
              start: { node, offset },
              end: { node, offset: offset + 1 }
            });
          }
        };

        const addElement = (node, placeholderBreak) => {
          if (node.nodeType === Node.TEXT_NODE) {
            addTextNode(node);
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return;
          if (node.tagName === 'BR') {
            if (placeholderBreak === node) return;
            const siblings = [...node.parentNode.childNodes];
            const offset = siblings.indexOf(node);
            items.push({
              character: markers.line,
              start: { node: node.parentNode, offset },
              end: { node: node.parentNode, offset: offset + 1 }
            });
            return;
          }
          [...node.childNodes].forEach((child) => addElement(child, placeholderBreak));
        };

        units.forEach((unit, index) => {
          const placeholderBreak = unit.nodeType === Node.ELEMENT_NODE
            && !unit.textContent
            && unit.childNodes.length === 1
            && unit.firstElementChild?.tagName === 'BR'
            ? unit.firstElementChild
            : null;
          addElement(unit, placeholderBreak);

          if (index < units.length - 1) {
            items.push({
              character: markers.paragraph,
              start: getNodePoint(unit, true),
              end: getNodePoint(units[index + 1], false)
            });
          }
        });

        return {
          text: items.map((item) => item.character).join(''),
          items
        };
      };

      const createRangeFromModel = (model, index, length) => {
        if (index < 0 || length < 1 || index + length > model.items.length) return null;
        const first = model.items[index];
        const last = model.items[index + length - 1];
        const range = document.createRange();
        range.setStart(first.start.node, first.start.offset);
        range.setEnd(last.end.node, last.end.offset);
        return range;
      };

      // 모델에서 특정 지점의 문자 인덱스를 찾습니다.
      const modelIndexAtPoint = (model, node, offset) => model.items
        .findIndex((item) => item.start.node === node && item.start.offset === offset);

      // ===== 편집 이력과 일괄 편집 =====
      // 예전에는 주석 노드로 일치 구간을 표시하고 구간마다 execCommand를 실행했습니다.
      // 그러면 실행 취소 기록에 "주석이 박힌 중간 상태"가 저장되어, Ctrl+Z를 누르면
      // 주석이 문서에 되살아나고 원본도 복구되지 않았습니다.
      //
      // 결과를 execCommand('insertHTML')로 한 번에 커밋하는 방법도 시도했지만,
      // 문서 전체를 선택한 상태에서 넣으면 브라우저가 첫 블록 안쪽에 나머지를
      // 중첩시켜(<h1>제목</h1><h1><p>본문</p></h1>) 구조가 망가집니다.
      //
      // 그래서 일괄 편집은 복제본에서 DOM을 직접 고쳐 통째로 반영합니다.
      //
      // 일괄 편집만 별도 스택에 넣으면 innerHTML 교체 순간 브라우저의 이전 입력
      // 이력이 끊기고, 일괄 편집을 취소한 뒤 새로 입력했을 때는 오래된 다시 실행이
      // 새 입력보다 먼저 적용됩니다. 일반 입력도 같은 스냅숏 이력에 기록해 두 이력을
      // 한 순서로 관리합니다.
      const EDIT_HISTORY_LIMIT = 100;
      const editorUndoStack = [];
      const editorRedoStack = [];
      let pendingInputBeforeHtml = null;
      let pendingInputHistoryGroup = '';
      let compositionBeforeHtml = null;
      let applyingHistory = false;
      let suppressingInputHistory = false;
      let currentHistoryHtml = editor.innerHTML;
      let historyGroupSequence = 0;

      const pushEditorHistory = (beforeHtml, afterHtml, group = '') => {
        currentHistoryHtml = afterHtml;
        if (beforeHtml === afterHtml) return false;
        const now = Date.now();
        const previous = editorUndoStack[editorUndoStack.length - 1];
        if (group
          && previous?.group === group
          && previous.afterHtml === beforeHtml
          && now - previous.changedAt < 1500) {
          previous.afterHtml = afterHtml;
          previous.changedAt = now;
        } else {
          editorUndoStack.push({ beforeHtml, afterHtml, group, changedAt: now });
        }
        if (editorUndoStack.length > EDIT_HISTORY_LIMIT) editorUndoStack.shift();
        editorRedoStack.length = 0;
        return true;
      };

      const breakEditorHistoryGroup = () => {
        historyGroupSequence += 1;
        pendingInputHistoryGroup = '';
      };

      const resetEditorHistory = () => {
        editorUndoStack.length = 0;
        editorRedoStack.length = 0;
        pendingInputBeforeHtml = null;
        pendingInputHistoryGroup = '';
        compositionBeforeHtml = null;
        currentHistoryHtml = editor.innerHTML;
        breakEditorHistoryGroup();
      };

      const applyEditorSnapshot = (html) => {
        applyingHistory = true;
        try {
          editor.innerHTML = html;
          normalizeEmptyDocument();
        } finally {
          applyingHistory = false;
        }
        currentHistoryHtml = editor.innerHTML;
        pendingInputBeforeHtml = null;
        pendingInputHistoryGroup = '';
        breakEditorHistoryGroup();
        invalidateFindResultsAfterDocumentChange();
        markDocumentDirty();
        updateCount();
        updateFormattingControlsState();
        hideSelectionToolbar();
      };

      const undoEditorHistory = () => {
        const entry = editorUndoStack[editorUndoStack.length - 1];
        if (!entry || editor.innerHTML !== entry.afterHtml) return false;
        editorUndoStack.pop();
        editorRedoStack.push(entry);
        applyEditorSnapshot(entry.beforeHtml);
        return true;
      };

      const redoEditorHistory = () => {
        const entry = editorRedoStack[editorRedoStack.length - 1];
        if (!entry || editor.innerHTML !== entry.beforeHtml) return false;
        editorRedoStack.pop();
        editorUndoStack.push(entry);
        applyEditorSnapshot(entry.afterHtml);
        return true;
      };

      // mutate(root)는 복제본을 직접 고치고 변경 건수를 돌려줍니다.
      // hooks.beforeCommit은 정리까지 끝난 복제본을, hooks.afterCommit은 반영이
      // 끝난 편집기를 받습니다. 실행 취소 스냅숏은 afterCommit 뒤에 찍으므로
      // afterCommit에서 임시 표식을 지워도 스냅숏이 오염되지 않습니다.
      const runBulkEdit = (mutate, hooks = {}) => {
        const beforeHtml = editor.innerHTML;
        const clone = editor.cloneNode(true);
        const count = mutate(clone);
        if (!count) return 0;
        pruneEmptyInlineElements(clone);
        pruneEmptyBlockContainers(clone);
        ensureBlockPlaceholders(clone);
        if (hooks.beforeCommit) hooks.beforeCommit(clone);

        // innerHTML을 갈아치우면 검색 위치와 개수도 더 이상 맞지 않습니다.
        invalidateFindResultsAfterDocumentChange();

        bulkEditing = true;
        try {
          editor.innerHTML = clone.innerHTML;
        } finally {
          bulkEditing = false;
        }
        normalizeEmptyDocument();
        if (hooks.afterCommit) hooks.afterCommit();

        breakEditorHistoryGroup();
        pushEditorHistory(beforeHtml, editor.innerHTML);

        markDocumentDirty();
        updateCount();
        updateFormattingControlsState();
        return count;
      };

      const BULK_BLOCK_TAGS = new Set([
        'P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'PRE', 'LI', 'TD', 'TH', 'DIV'
      ]);

      const blockAncestor = (node, root) => {
        let element = node && node.nodeType === Node.ELEMENT_NODE ? node : node?.parentNode;
        for (; element && element !== root; element = element.parentNode) {
          if (element.nodeType === Node.ELEMENT_NODE && BULK_BLOCK_TAGS.has(element.tagName)) return element;
        }
        return null;
      };

      // 내용이 사라진 목록·표 껍데기를 정리합니다.
      const pruneEmptyBlockContainers = (root) => {
        [...root.querySelectorAll('ul,ol')].forEach((list) => {
          if (!list.querySelector('li')) list.remove();
        });
      };

      // 완전히 빈 블록은 커서를 놓을 수 없으므로 자리표시 <br>을 채웁니다.
      const ensureBlockPlaceholders = (root) => {
        const selector = [...BULK_BLOCK_TAGS].join(',').toLowerCase();
        [...root.querySelectorAll(selector)].forEach((block) => {
          if (!block.childNodes.length) block.appendChild(root.ownerDocument.createElement('br'));
        });
      };

      // 블록 경계를 넘는 범위를 지울 때는 두 블록을 하나로 합쳐야 합니다.
      // Range.deleteContents는 경계 사이에 아무것도 없으면 블록을 그대로 두기 때문에
      // (예: ^p 를 다른 글자로 바꾸기) 합치는 일을 직접 해 줍니다.
      const deleteRangeMergingBlocks = (range, root) => {
        const startBlock = blockAncestor(range.startContainer, root);
        const endBlock = blockAncestor(range.endContainer, root);
        range.deleteContents();
        if (!startBlock || !endBlock || startBlock === endBlock) return;
        // 복제본은 문서에 붙어 있지 않으므로 isConnected로 판단하면 안 됩니다.
        // 편집 대상 트리 안에 아직 남아 있는지만 확인합니다.
        if (!root.contains(startBlock) || !root.contains(endBlock)) return;

        // 빈 문단 자리표시용 <br>은 합칠 때 방해가 되므로 지웁니다.
        if (startBlock.lastChild?.nodeName === 'BR') startBlock.lastChild.remove();
        const joinIndex = startBlock.childNodes.length;
        while (endBlock.firstChild) startBlock.appendChild(endBlock.firstChild);
        endBlock.remove();
        range.setStart(startBlock, joinIndex);
        range.collapse(true);
      };

      // 커서 위치에서 문단을 둘로 나눕니다. ^p 치환에 필요합니다.
      // 표의 칸은 나눌 수 있는 블록이 아닙니다. 문단처럼 쪼개면 같은 태그의
      // 형제가 생겨 칸 수가 늘고 표 모양이 무너집니다. 칸 안에서 Enter를 직접
      // 누를 때도 칸이 늘지 않고 줄만 바뀌므로 붙여넣기도 그 동작에 맞춥니다.
      const UNSPLITTABLE_BLOCK_TAGS = new Set(['TD', 'TH']);

      const splitBlockAtRange = (range, root) => {
        const block = blockAncestor(range.startContainer, root);
        const doc = root.ownerDocument;
        if (!block || UNSPLITTABLE_BLOCK_TAGS.has(block.tagName)) {
          // 나눌 문단이 없으면 줄바꿈으로 대체합니다.
          const lineBreak = doc.createTextNode('\n');
          range.insertNode(lineBreak);
          range.setStartAfter(lineBreak);
          range.collapse(true);
          return;
        }

        const tail = doc.createRange();
        tail.setStart(range.startContainer, range.startOffset);
        tail.setEnd(block, block.childNodes.length);
        const after = block.cloneNode(false);
        after.appendChild(tail.extractContents());
        // 빈 블록의 자리표시 <br>은 편집이 모두 끝난 뒤 한 번에 채웁니다.
        // 여기서 미리 넣으면 곧바로 글자가 들어올 때 뒤에 빈 줄로 남습니다.
        block.parentNode.insertBefore(after, block.nextSibling);
        range.setStart(after, 0);
        range.collapse(true);
      };

      // 범위를 토큰 열로 대체합니다. execCommand를 쓰지 않으므로 복제본에서도 안전합니다.
      // 토큰이 순수한 글자뿐이면 하나의 문자열로 합칩니다. 아니면 null입니다.
      const plainTokenText = (tokens) => (tokens.some((token) => token.type !== 'text')
        ? null
        : tokens.map((token) => token.value || '').join(''));

      // 토큰이 지닌 인라인 서식(붙여넣기용)을 그 토큰이 만든 노드에만 적용합니다.
      const applyTokenStyle = (node, root, style) => {
        const apply = [];
        const remove = [];
        CLIPBOARD_FORMAT_KEYS.forEach(([key, format]) => {
          (style[key] ? apply : remove).push(format);
        });
        const range = document.createRange();
        range.selectNode(node);
        const next = applyFormatSettingsToRange(range, root, { apply, remove });
        if (style.href) applyLinkToRange(next, root, style.href);
      };

      const replaceRangeWithTokens = (range, tokens, root, settings = { apply: [], remove: [] }) => {
        const styled = tokens.some((token) => token.style);
        // 빠른 경로: 한 텍스트 노드 안에서 글자만 바꾸는 흔한 경우입니다.
        // 노드를 쪼개거나 새로 만들지 않으므로 한 문단에 일치가 수천 개 있어도
        // 문단의 자식 수가 늘지 않습니다. 자식 수가 늘면 삽입 비용이 자식 수에
        // 비례해 커져서 전체가 제곱으로 느려집니다.
        if (!styled && !settings.apply.length && !settings.remove.length
          && range.startContainer === range.endContainer
          && range.startContainer.nodeType === Node.TEXT_NODE) {
          const value = plainTokenText(tokens);
          if (value !== null) {
            const node = range.startContainer;
            const start = range.startOffset;
            node.replaceData(start, range.endOffset - start, value);
            range.setStart(node, start + value.length);
            range.collapse(true);
            return;
          }
        }

        deleteRangeMergingBlocks(range, root);

        // 빈 문단의 자리표시 <br>은 글자를 넣는 순간 필요 없어집니다.
        // 남겨 두면 붙여넣은 내용 뒤에 빈 줄이 하나 더 보입니다.
        const targetBlock = blockAncestor(range.startContainer, root);
        if (targetBlock
          && targetBlock.childNodes.length === 1
          && targetBlock.firstChild.nodeName === 'BR') {
          targetBlock.removeChild(targetBlock.firstChild);
          range.setStart(targetBlock, 0);
          range.collapse(true);
        }

        const doc = root.ownerDocument;
        const inserted = [];
        const styledNodes = [];
        tokens.forEach((token) => {
          if (token.type === 'paragraph') {
            splitBlockAtRange(range, root);
            return;
          }
          let node = null;
          // 이 편집기는 white-space: pre-wrap이므로 문단 안 줄바꿈은 <br>이 아니라
          // 개행 문자입니다. Shift+Enter와 붙여넣기가 만드는 형태와 같습니다.
          if (token.type === 'line') node = doc.createTextNode('\n');
          else if (token.type === 'tab') node = doc.createTextNode('\t');
          else if (token.type === 'text' && token.value) node = doc.createTextNode(token.value);
          if (!node) return;
          range.insertNode(node);
          range.setStartAfter(node);
          range.collapse(true);
          inserted.push(node);
          if (token.style) styledNodes.push({ node, style: token.style });
        });

        if (inserted.length && (settings.apply.length || settings.remove.length)) {
          applyFormatSettingsToRange(rangeAround(inserted), root, settings);
        }

        // 서식은 글자를 모두 넣은 뒤 뒤에서부터 적용합니다. 넣는 도중에 감싸면
        // 다음 삽입 위치가 어긋납니다.
        [...styledNodes].reverse().forEach(({ node, style }) => {
          applyTokenStyle(node, root, style);
        });

        // 붙여넣기에서 커서를 되돌릴 기준점으로 씁니다.
        return inserted.length ? inserted[inserted.length - 1] : null;
      };
      // ===== 일괄 편집 끝 =====

      const selectEditorRange = (range) => {
        focusEditor();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      };

      // ===== 대소문자 구분 없는 찾기 =====
      // 모델 인덱스가 실제 DOM 위치로 환산되므로, 접어 만든 문자열은 원본과 길이가
      // 같아야 합니다. 'İ'.toLowerCase()처럼 길이가 늘어나는 글자는 접지 않고 둡니다.
      const foldForSearch = (value) => {
        let folded = '';
        for (const character of String(value)) {
          const lower = character.toLowerCase();
          folded += lower.length === character.length ? lower : character;
        }
        return folded;
      };

      const searchIsCaseSensitive = () => matchCase.checked;

      // 검색에 쓸 텍스트. 대소문자를 구분하면 원본을 그대로 씁니다.
      // 대소문자를 무시할 때는 문서와 검색어를 동시에 기억해야 합니다. 캐시가
      // 한 칸뿐이면 둘이 서로를 밀어내 선택 위치를 찾는 루프마다 문서 전체를 다시
      // 접게 됩니다. 최근 문자열 네 개만 보관해 메모리는 제한합니다.
      const FOLD_CACHE_LIMIT = 4;
      const foldCache = new Map();

      const searchableText = (text) => {
        const source = String(text);
        if (searchIsCaseSensitive()) return source;
        if (foldCache.has(source)) return foldCache.get(source);
        const result = foldForSearch(source);
        foldCache.set(source, result);
        if (foldCache.size > FOLD_CACHE_LIMIT) {
          foldCache.delete(foldCache.keys().next().value);
        }
        return result;
      };

      const searchIndexOf = (haystack, needle, from = 0) => searchableText(haystack)
        .indexOf(searchableText(needle), from);

      const searchLastIndexOf = (haystack, needle, from) => searchableText(haystack)
        .lastIndexOf(searchableText(needle), from);

      // 문서 안의 일치 개수와, 현재 위치가 그중 몇 번째인지 셉니다.
      const countSearchMatches = (modelText, needle, currentIndex) => {
        if (!needle) return { total: 0, ordinal: 0 };
        const haystack = searchableText(modelText);
        const target = searchableText(needle);
        const step = Math.max(1, target.length);
        let total = 0;
        let ordinal = 0;
        let cursor = 0;
        for (;;) {
          const index = haystack.indexOf(target, cursor);
          if (index < 0) break;
          total += 1;
          if (index === currentIndex) ordinal = total;
          if (total >= MATCH_LIMIT) break;
          cursor = index + step;
        }
        return { total, ordinal };
      };

      // 일치 개수 표시를 갱신합니다. 찾을 내용이 비면 아무것도 보이지 않습니다.
      const updateFindCountNow = () => {
        const query = findText.value;
        if (!findbar.classList.contains('open') || !query) {
          findCount.textContent = '';
          findCount.classList.remove('is-empty');
          return;
        }
        let total = 0;
        let ordinal = 0;
        try {
          const markers = pickSpecialSearchMarkers(editor, [query, replaceText.value]);
          const parsedQuery = parseSpecialCodes(query, markers);
          if (parsedQuery.text) {
            const model = buildSpecialSearchModel(editor, markers);
            const stateKey = parsedQuery.usesCodes ? `special:${query}` : `literal:${query}`;
            const current = specialSearchState.query === stateKey ? specialSearchState.index : -1;
            ({ total, ordinal } = countSearchMatches(model.text, parsedQuery.text, current));
          }
        } catch (error) {
          // 표식을 만들 수 없는 극단적인 문서에서는 개수 표시를 생략합니다.
          findCount.textContent = '';
          findCount.classList.remove('is-empty');
          return;
        }
        findCount.classList.toggle('is-empty', total === 0);
        if (!total) {
          findCount.textContent = '없음';
          return;
        }
        const shown = total >= MATCH_LIMIT ? `${MATCH_LIMIT.toLocaleString()}+` : total.toLocaleString();
        findCount.textContent = ordinal ? `${ordinal} / ${shown}` : `${shown}개`;
      };

      // 개수 세기는 문서 전체 검색 모델을 다시 만들기 때문에 긴 문서에서는
      // 한 번에 수백 밀리초가 듭니다. 글자를 칠 때마다 세면 입력이 밀리고,
      // 예약된 세기가 바로 뒤에 오는 바꾸기 작업과 겹쳐 그쪽까지 느려집니다.
      // 그래서 입력이 멈춘 뒤에 한 번만 셉니다.
      const FIND_COUNT_DELAY = 180;
      let findCountTimer = null;

      const cancelScheduledFindCount = () => {
        if (findCountTimer === null) return;
        clearTimeout(findCountTimer);
        findCountTimer = null;
      };

      const scheduleFindCount = () => {
        cancelScheduledFindCount();
        findCountTimer = setTimeout(() => {
          findCountTimer = null;
          updateFindCountNow();
        }, FIND_COUNT_DELAY);
      };

      // 찾기·바꾸기 같은 명시적 동작 뒤에는 곧바로 갱신합니다.
      const updateFindCount = () => {
        cancelScheduledFindCount();
        updateFindCountNow();
      };

      // ===== 찾은 구간 표시 =====
      // 찾기 입력칸에서 Enter를 계속 누르려면 포커스가 입력칸에 남아야 합니다.
      // 그런데 편집기 밖으로 포커스가 나가면 선택 영역은 그려지지 않습니다.
      // CSS Custom Highlight API로 DOM을 건드리지 않고 구간만 칠합니다.
      // <mark>를 넣는 방식은 실행 취소 기록과 검색 모델을 오염시킵니다.
      const FIND_HIGHLIGHT = 'find-match';
      const supportsFindHighlight = typeof CSS !== 'undefined'
        && !!CSS.highlights
        && typeof Highlight === 'function';

      const clearFindHighlight = () => {
        if (!supportsFindHighlight) return;
        CSS.highlights.delete(FIND_HIGHLIGHT);
      };

      const showFindHighlight = (range) => {
        if (!supportsFindHighlight) return false;
        try {
          CSS.highlights.set(FIND_HIGHLIGHT, new Highlight(range.cloneRange()));
          return true;
        } catch (error) {
          return false;
        }
      };

      const invalidateFindResultsAfterDocumentChange = () => {
        clearFindHighlight();
        specialSearchState = { query: '', nextIndex: 0, index: -1, range: null };
        if (findbar.classList.contains('open')) scheduleFindCount();
      };

      // 찾은 구간을 화면에 보이게 스크롤합니다. 실제 스크롤 컨테이너는 editor가
      // 아니라 workspace입니다. 문서 전체 경계와 비교하면 화면 밖 결과도 항상
      // editor 안에 있으므로 스크롤이 일어나지 않습니다.
      const scrollFindRangeIntoView = (range) => {
        const rect = range.getBoundingClientRect();
        if (!rect.height && !rect.width) return;
        const view = workspace.getBoundingClientRect();
        if (rect.top >= view.top && rect.bottom <= view.bottom) return;
        const anchor = range.startContainer.nodeType === Node.ELEMENT_NODE
          ? range.startContainer
          : range.startContainer.parentElement;
        anchor?.scrollIntoView({ block: 'center', inline: 'nearest' });
      };

      // 앞뒤 찾기를 한 함수로 처리합니다. 특수기호(^p·^l)가 섞인 검색도 모델
      // 텍스트에서는 한 글자짜리 표식이 되므로 일반 검색과 같은 경로를 씁니다.
      // direction: 1은 다음, -1은 이전.
      // keepFocus를 주면 편집기로 포커스를 옮기지 않아 입력칸에서 Enter를
      // 계속 누를 수 있습니다.
      const findInDirection = (direction, { keepFocus = false } = {}) => {
        const query = findText.value;
        if (!query) return false;
        const markers = pickSpecialSearchMarkers(editor, [query, replaceText.value]);
        const parsedQuery = parseSpecialCodes(query, markers);
        const needle = parsedQuery.text;
