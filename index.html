        if (!needle) return false;

        const model = buildSpecialSearchModel(editor, markers);
        const stateQuery = parsedQuery.usesCodes ? `special:${query}` : `literal:${query}`;
        const sameQuery = specialSearchState.query === stateQuery;
        let index;

        if (direction < 0) {
          // 현재 일치 구간의 바로 앞에서부터 뒤로 찾습니다. 검색 상태가 없으면
          // 화면에서 선택된 구간을 기준으로 삼아, 직접 드래그한 뒤에도 이어집니다.
          const anchor = sameQuery && specialSearchState.index >= 0
            ? specialSearchState.index
            : matchIndexForSelection(model, needle);
          const from = anchor >= 0 ? anchor - 1 : model.text.length;
          index = from < 0 ? -1 : searchLastIndexOf(model.text, needle, from);
          // 문서 앞에서 막히면 끝으로 순환합니다.
          if (index < 0) index = searchLastIndexOf(model.text, needle, model.text.length);
        } else {
          const startIndex = sameQuery ? specialSearchState.nextIndex : 0;
          index = searchIndexOf(model.text, needle, startIndex);
          if (index < 0 && startIndex > 0) index = searchIndexOf(model.text, needle, 0);
        }

        if (index < 0) {
          showToast('찾을 수 없습니다');
          clearFindHighlight();
          updateFindCount();
          return false;
        }

        const range = createRangeFromModel(model, index, needle.length);
        if (!range) {
          showToast('찾을 수 없습니다');
          clearFindHighlight();
          updateFindCount();
          return false;
        }

        if (keepFocus && showFindHighlight(range)) {
          // contenteditable 안에 선택 영역을 만들면 브라우저가 편집기로 포커스를
          // 옮깁니다. focus()를 부르지 않아도 그렇습니다. 그래서 입력칸에 포커스를
          // 남길 수 있는 환경에서는 선택을 건드리지 않고 하이라이트만 씁니다.
          scrollFindRangeIntoView(range);
        } else {
          // Highlight API가 없거나 등록에 실패하면 포커스 유지는 포기하더라도
          // 기존 선택 방식으로 찾은 위치를 확실하게 보여 줍니다.
          clearFindHighlight();
          selectEditorRange(range);
        }

        specialSearchState = {
          query: stateQuery,
          nextIndex: index + Math.max(1, needle.length),
          index,
          range: range.cloneRange()
        };
        updateFindCount();
        return true;
      };

      const findNext = () => findInDirection(1);
      const findPrevious = () => findInDirection(-1);
      // 입력칸에서 Enter로 이어 찾을 때 씁니다.
      const findNextKeepingFocus = () => findInDirection(1, { keepFocus: true });
      const findPreviousKeepingFocus = () => findInDirection(-1, { keepFocus: true });

      const particlePairs = [
        { consonant: '으로부터', vowel: '로부터', rieul: '로부터' },
        { consonant: '으로써', vowel: '로써', rieul: '로써' },
        { consonant: '으로서', vowel: '로서', rieul: '로서' },
        { consonant: '이에요', vowel: '예요' },
        { consonant: '이랑', vowel: '랑' },
        { consonant: '이나', vowel: '나' },
        { consonant: '으로', vowel: '로', rieul: '로' },
        { consonant: '은', vowel: '는' },
        { consonant: '이', vowel: '가' },
        { consonant: '을', vowel: '를' },
        { consonant: '과', vowel: '와' }
      ];

      const getHangulEnding = (value) => {
        const lastCharacter = String(value).slice(-1);
        if (!lastCharacter) return null;
        const code = lastCharacter.charCodeAt(0);
        if (code < 0xAC00 || code > 0xD7A3) return null;
        const finalIndex = (code - 0xAC00) % 28;
        return {
          hasFinal: finalIndex !== 0,
          isRieul: finalIndex === 8
        };
      };

      const isParticleBoundary = (character) => !character || !/[\p{L}\p{N}]/u.test(character);

      const getParticleAdjustment = (suffix, replacement) => {
        const ending = getHangulEnding(replacement);
        if (!ending) return null;

        for (const pair of particlePairs) {
          const desired = ending.hasFinal
            ? (ending.isRieul && pair.rieul ? pair.rieul : pair.consonant)
            : pair.vowel;
          const currentForms = [...new Set([pair.consonant, pair.vowel, pair.rieul].filter(Boolean))]
            .sort((left, right) => right.length - left.length);
          for (const current of currentForms) {
            if (suffix.startsWith(current) && isParticleBoundary(suffix[current.length])) {
              return { current, desired };
            }
          }
        }
        return null;
      };

      const CLIPBOARD_FORMAT_KEYS = [
        ['bold', 'bold'],
        ['italic', 'italic'],
        ['underline', 'underline'],
        ['strike', 'strikeThrough']
      ];

      const normalizeClipboardText = (value) => String(value).replace(/\r\n?/g, '\n');

      // style을 주면 만들어지는 글자 토큰이 그 인라인 서식을 함께 지닙니다.
      const plainTextToSpecialTokens = (source, style = null) => {
        const tokens = [];
        let buffer = '';
        const flushText = () => {
          if (!buffer) return;
          tokens.push(style ? { type: 'text', value: buffer, style } : { type: 'text', value: buffer });
          buffer = '';
        };

        for (const character of normalizeClipboardText(source)) {
          if (character === '\n') {
            flushText();
            tokens.push({ type: 'line' });
          } else if (character === '\t') {
            flushText();
            tokens.push({ type: 'tab' });
          } else {
            buffer += character;
          }
        }
        flushText();
        return tokens;
      };

      // 위치를 자식 인덱스 경로로 기록합니다. 복제본은 구조가 같으므로 같은
      // 경로로 되찾을 수 있습니다. 검색 모델의 문자 인덱스와 달리 빈 문단처럼
      // 글자가 없는 자리도 정확히 가리킵니다.
      const nodePathWithin = (root, node, offset) => {
        const path = [];
        let current = node;
        while (current && current !== root) {
          const parent = current.parentNode;
          if (!parent) return null;
          path.unshift([...parent.childNodes].indexOf(current));
          current = parent;
        }
        if (current !== root) return null;
        return { path, offset };
      };

      const nodeAtPath = (root, path) => {
        let node = root;
        for (const index of path) {
          if (!node.childNodes[index]) return null;
          node = node.childNodes[index];
        }
        return node;
      };

      // 편집기 최상위를 가리키는 위치는 문단 안쪽으로 옮깁니다. 최상위에 그대로
      // 넣으면 문단 밖에 글자가 생겨 문단 나누기도 동작하지 않습니다.
      const moveBoundaryIntoBlock = (root, boundary) => {
        if (!boundary || boundary.node !== root) return boundary;
        const children = [...root.childNodes];
        if (!children.length) return boundary;
        const isBlock = (node) => node?.nodeType === Node.ELEMENT_NODE
          && BULK_BLOCK_TAGS.has(node.tagName);
        if (boundary.offset >= children.length) {
          const last = children[children.length - 1];
          return isBlock(last) ? { node: last, offset: last.childNodes.length } : boundary;
        }
        const target = children[boundary.offset];
        return isBlock(target) ? { node: target, offset: 0 } : boundary;
      };

      const boundaryFromPath = (root, descriptor) => {
        if (!descriptor) return null;
        const node = nodeAtPath(root, descriptor.path);
        if (!node) return null;
        const limit = node.nodeType === Node.TEXT_NODE
          ? (node.nodeValue?.length ?? 0)
          : node.childNodes.length;
        return moveBoundaryIntoBlock(root, { node, offset: Math.min(descriptor.offset, limit) });
      };

      // 마지막 블록 안쪽 끝을 가리킵니다. 최상위에 넣으면 문단 밖에 글자가 생깁니다.
      const collapsedRangeAtEnd = (root) => {
        let node = root;
        while (node.lastChild
          && node.lastChild.nodeType === Node.ELEMENT_NODE
          && BULK_BLOCK_TAGS.has(node.lastChild.tagName)) {
          node = node.lastChild;
        }
        const range = document.createRange();
        range.selectNodeContents(node);
        range.collapse(false);
        return range;
      };

      const PASTE_CARET_MARK = 'data-paste-caret';

      // 붙여넣기도 일괄 편집과 같은 경로를 씁니다.
      //
      // execCommand로 한 구간씩 넣으면서 서식을 커서 상태로 토글하는 방식은
      // 브라우저 출력을 제어할 수 없었습니다. 실제 Chromium에서 확인한 문제입니다.
      //  - 굵은 글자 뒤에 기울임을 더하면 태그가 아니라
      //    <i style="font-weight:bold"> 로 만들어져 마크다운·카페 복사에서 굵게가
      //    사라집니다.
      //  - 굵은 글자 뒤에서 문단을 나누면 커서를 서식 밖으로 옮기고 서식을 꺼도
      //    빈 문단이 <p><b><br></b></p> 로 만들어집니다. removeFormat으로도
      //    지워지지 않습니다.
      //
      // 그래서 커서 위치를 검색 모델의 문자 인덱스로 기록해 두고, 복제본에서
      // DOM을 직접 조립한 뒤 통째로 반영하고 커서를 되돌립니다. 서식은 실제
      // 범위에 적용하므로 결과가 예측 가능하고, 실행 취소도 한 단계입니다.
      const insertClipboardTokens = (tokens) => {
        if (!tokens.length) return;
        const selection = window.getSelection();
        let startPath = null;
        let endPath = null;
        if (selection && selection.rangeCount && selectionIsInsideEditor()) {
          const live = selection.getRangeAt(0);
          startPath = nodePathWithin(editor, live.startContainer, live.startOffset);
          endPath = nodePathWithin(editor, live.endContainer, live.endOffset);
        }

        let lastNode = null;
        const changed = runBulkEdit((root) => {
          let range = null;
          const start = boundaryFromPath(root, startPath);
          const end = boundaryFromPath(root, endPath);
          if (start && end) {
            range = document.createRange();
            range.setStart(start.node, start.offset);
            try {
              range.setEnd(end.node, end.offset);
            } catch (error) {
              range.collapse(true);
            }
          } else {
            range = collapsedRangeAtEnd(root);
          }

          lastNode = replaceRangeWithTokens(range, tokens, root);
          return 1;
        }, {
          // 커서 자리를 임시 표식으로 남깁니다. 자식 인덱스 경로로 기록하면
          // innerHTML을 다시 파싱할 때 이웃한 텍스트 노드가 하나로 합쳐져
          // 경로가 어긋나고, 커서가 문서 맨 앞으로 돌아갑니다.
          beforeCommit(root) {
            if (!lastNode || !root.contains(lastNode) || !lastNode.parentNode) return;
            const mark = root.ownerDocument.createElement('span');
            mark.setAttribute(PASTE_CARET_MARK, '1');
            lastNode.parentNode.insertBefore(mark, lastNode.nextSibling);
          },
          afterCommit() {
            const mark = editor.querySelector(`[${PASTE_CARET_MARK}]`);
            const caret = document.createRange();
            if (mark && mark.parentNode) {
              const parent = mark.parentNode;
              const index = [...parent.childNodes].indexOf(mark);
              mark.remove();
              caret.setStart(parent, index);
              caret.collapse(true);
            } else {
              // 표식을 잃어도 맨 앞으로 돌아가지 않게 문서 끝에 둡니다.
              const fallback = collapsedRangeAtEnd(editor);
              caret.setStart(fallback.startContainer, fallback.startOffset);
              caret.collapse(true);
            }
            selectEditorRange(caret);
            saveSelection();
          }
        });
        if (!changed) return;
        updateCount();
      };

      // 이 편집기에서 Enter는 새 문단, Shift+Enter는 문단 안의 줄바꿈입니다.
      // 붙여넣기도 같은 규칙을 따라야 원본과 줄 구조가 같아집니다.
      // keepFormatting이 참이면 구간별 인라인 서식을 함께 싣습니다.
      const clipboardTokensFromLines = (lines, keepFormatting = false) => {
        const tokens = [];
        // 줄을 나누기 전에 서식을 해제합니다. 굵게가 켜진 상태로 문단을 나누면
        // 빈 문단이 <p><b><br></b></p> 처럼 만들어집니다.
        const resetBeforeBreak = () => {
          if (keepFormatting) tokens.push({ type: 'style', style: EMPTY_CLIPBOARD_STYLE });
        };

        lines.forEach((line, lineIndex) => {
          if (lineIndex) {
            resetBeforeBreak();
            tokens.push({ type: 'paragraph' });
          }
          line.forEach((runs, segmentIndex) => {
            if (segmentIndex) {
              resetBeforeBreak();
              tokens.push({ type: 'line' });
            }
            runs.forEach((run) => {
              plainTextToSpecialTokens(run.text, keepFormatting ? run : null)
                .forEach((token) => tokens.push(token));
            });
          });
        });
        return tokens;
      };

      const insertPlainTextPreservingBreaks = (text) => {
        const lines = normalizeClipboardText(text)
          .split('\n')
          .map((line) => [[{ ...EMPTY_CLIPBOARD_STYLE, text: line }]]);
        insertClipboardTokens(clipboardTokensFromLines(lines));
      };

      const MATCH_LIMIT = 10000;

      // 모델 텍스트에서 일치 구간을 모읍니다. 조사 교정 계산도 여기서 함께 합니다.
      // 단일 바꾸기와 모두 바꾸기가 같은 규칙을 쓰도록 한곳에 모았습니다.
      const collectMatches = (model, query, { replacement = null, withParticles = false } = {}) => {
        const matches = [];
        let cursor = 0;
        let particleCount = 0;
        let truncated = false;
        // 일치마다 다시 접지 않도록 검색 문자열을 미리 준비합니다.
        const haystack = searchableText(model.text);
        const needle = searchableText(query);

        for (;;) {
          const start = haystack.indexOf(needle, cursor);
          if (start < 0) break;
          if (matches.length >= MATCH_LIMIT) {
            truncated = true;
            break;
          }
          let end = start + query.length;
          let insertion = replacement;
          if (withParticles && replacement !== null) {
            const adjustment = getParticleAdjustment(model.text.slice(end), replacement);
            if (adjustment && adjustment.current !== adjustment.desired) {
              end += adjustment.current.length;
              insertion += adjustment.desired;
              particleCount += 1;
            }
          }
          matches.push({ start, length: end - start, insertion });
          cursor = end;
        }
        return { matches, particleCount, truncated };
      };

      // 일치 구간을 문서 뒤에서부터 처리합니다. 뒤쪽을 먼저 고치면 앞쪽 구간의
      // (노드, 오프셋)이 그대로 유지되므로 위치 표시용 주석 마커가 필요 없습니다.
      // Range.extractContents와 Text.splitText는 모두 원본 텍스트 노드를 남기고
      // 앞부분을 보존하기 때문에 앞쪽 오프셋이 깨지지 않습니다.
      const applyMatchesDescending = (model, matches, apply) => {
        let count = 0;
        [...matches].sort((left, right) => right.start - left.start).forEach((match) => {
          const range = createRangeFromModel(model, match.start, match.length);
          if (!range) return;
          apply(range, match);
          count += 1;
        });
        return count;
      };

      const replaceAllSpecial = (parsedQuery, parsedReplacement, settings, formattingOnly, markers) => {
        if (!parsedQuery.text) return { count: 0, truncated: false };
        let truncated = false;
        const count = runBulkEdit((root) => {
          const model = buildSpecialSearchModel(root, markers);
          const collected = collectMatches(model, parsedQuery.text);
          truncated = collected.truncated;
          return applyMatchesDescending(model, collected.matches, (range) => {
            if (formattingOnly) applyFormatSettingsToRange(range, root, settings);
            else replaceRangeWithTokens(range, parsedReplacement.tokens, root, settings);
          });
        });
        specialSearchState = { query: '', nextIndex: 0, index: -1, range: null };
        return { count, truncated };
      };

      // 화면에서 선택된 구간이 모델의 몇 번째 일치 구간인지 찾습니다.
      const matchIndexForSelection = (model, query) => {
        const selection = window.getSelection();
        if (!query || !selection || !selection.rangeCount || !selectionIsInsideEditor()) return -1;
        const target = selection.getRangeAt(0);
        let cursor = 0;
        for (;;) {
          const index = searchIndexOf(model.text, query, cursor);
          if (index < 0) return -1;
          const range = createRangeFromModel(model, index, query.length);
          try {
            if (range && range.compareBoundaryPoints(Range.START_TO_START, target) === 0) return index;
          } catch (error) {
            return -1;
          }
          cursor = index + Math.max(1, query.length);
        }
      };

      const replaceCurrent = () => {
        const query = findText.value;
        if (!query) {
          showToast('찾을 내용을 입력하세요.');
          return;
        }
        const markers = pickSpecialSearchMarkers(editor, [query, replaceText.value]);
        const parsedQuery = parseSpecialCodes(query, markers);
        const parsedReplacement = parseSpecialCodes(replaceText.value, markers);
        const settings = getReplacementFormatSettings();
        const formattingOnly = !replaceText.value && hasReplacementFormatSettings(settings);
        const stateKey = parsedQuery.usesCodes ? `special:${query}` : `literal:${query}`;

        // 바꿀 위치를 모델 인덱스로 확정합니다. 예전에는 검색 상태가 없으면 다음
        // 검색 시작 위치를 0으로 되돌렸기 때문에, 사용자가 직접 드래그해서 바꾼
        // 경우 방금 삽입한 문자열을 다시 찾아 같은 단어가 계속 늘어났습니다.
        const liveModel = buildSpecialSearchModel(editor, markers);
        const index = specialSearchState.query === stateKey && specialSearchState.index >= 0
          ? specialSearchState.index
          : matchIndexForSelection(liveModel, parsedQuery.text);
        if (index < 0) {
          findNext();
          return;
        }

        let length = parsedQuery.text.length;
        let tokens = parsedReplacement.tokens;
        let insertedLength = parsedReplacement.text.length;
        let particleAdjusted = false;

        // 조사 교정도 모델 텍스트를 기준으로 봅니다. 예전에는 같은 텍스트 노드
        // 안에서만 조사를 찾아, 조사가 다른 서식에 들어 있으면 단일 바꾸기에서만
        // 교정이 빠지고 모두 바꾸기와 결과가 달라졌습니다.
        if (!formattingOnly && !parsedReplacement.usesCodes && adjustParticles.checked) {
          const adjustment = getParticleAdjustment(
            liveModel.text.slice(index + length),
            replaceText.value
          );
          if (adjustment && adjustment.current !== adjustment.desired) {
            length += adjustment.current.length;
            tokens = [...parsedReplacement.tokens, { type: 'text', value: adjustment.desired }];
            insertedLength += adjustment.desired.length;
            particleAdjusted = true;
          }
        }

        const changed = runBulkEdit((root) => {
          const model = buildSpecialSearchModel(root, markers);
          const range = createRangeFromModel(model, index, length);
          if (!range) return 0;
          if (formattingOnly) applyFormatSettingsToRange(range, root, settings);
          else replaceRangeWithTokens(range, tokens, root, settings);
          return 1;
        });

        specialSearchState = {
          query: stateKey,
          nextIndex: index + Math.max(0, formattingOnly ? length : insertedLength),
          index: -1,
          range: null
        };
        findNext();

        if (!changed) return;
        if (formattingOnly) showToast('글자는 유지하고 선택한 서식만 변경했습니다.');
        else if (particleAdjusted) showToast('단어와 조사를 받침에 맞게 바꿨습니다.');
        else if (parsedQuery.usesCodes || parsedReplacement.usesCodes) showToast('특수기호를 포함해 바꿨습니다.');
      };

      const truncationNotice = (truncated) => (truncated
        ? ` 한 번에 ${MATCH_LIMIT.toLocaleString()}개까지만 처리했습니다. 남은 항목은 다시 실행하세요.`
        : '');

      const replaceAll = () => {
        const query = findText.value;
        const settings = getReplacementFormatSettings();

        if (!query) {
          if (!hasReplacementFormatSettings(settings)) {
            showToast('찾을 내용을 입력하거나 바꿀 서식을 지정하세요.');
            return;
          }
          const changed = runBulkEdit((root) => {
            const range = root.ownerDocument.createRange();
            range.selectNodeContents(root);
            applyFormatSettingsToRange(range, root, settings);
            return 1;
          });
          showToast(changed
            ? '문서 전체의 서식을 지정한 대로 변경했습니다.'
            : '변경할 내용이 없습니다.');
          return;
        }

        const markers = pickSpecialSearchMarkers(editor, [query, replaceText.value]);
        const parsedQuery = parseSpecialCodes(query, markers);
        const parsedReplacement = parseSpecialCodes(replaceText.value, markers);
        const formattingOnly = !replaceText.value && hasReplacementFormatSettings(settings);

        if (parsedQuery.usesCodes || parsedReplacement.usesCodes) {
          const { count, truncated } = replaceAllSpecial(
            parsedQuery,
            parsedReplacement,
            settings,
            formattingOnly,
            markers
          );
          showToast((formattingOnly
            ? `${count}개 항목의 서식을 변경했습니다.`
            : `${count}개 항목을 특수기호 규칙으로 바꿨습니다.`) + truncationNotice(truncated));
          updateFindCount();
          return;
        }

        const replacement = formattingOnly ? query : replaceText.value;
        const withParticles = !formattingOnly && adjustParticles.checked;
        let particleCount = 0;
        let truncated = false;

        const count = runBulkEdit((root) => {
          const model = buildSpecialSearchModel(root, markers);
          const collected = collectMatches(model, query, { replacement, withParticles });
          particleCount = collected.particleCount;
          truncated = collected.truncated;
          return applyMatchesDescending(model, collected.matches, (range, match) => {
            if (formattingOnly) applyFormatSettingsToRange(range, root, settings);
            else replaceRangeWithTokens(range, [{ type: 'text', value: match.insertion }], root, settings);
          });
        });

        specialSearchState = { query: '', nextIndex: 0, index: -1, range: null };
        const particleMessage = particleCount ? ` · 조사 ${particleCount}개 자동 교정` : '';
        showToast((formattingOnly
          ? `${count}개 항목의 서식을 변경했습니다.`
          : `${count}개 항목을 바꿨습니다${particleMessage}.`) + truncationNotice(truncated));
        updateFindCount();
      };

      // 일반 입력과 일괄 편집을 같은 순서로 실행 취소·다시 실행합니다.
      const performUndo = () => {
        if (undoEditorHistory()) return;
        runCommand('undo');
      };

      const performRedo = () => {
        if (redoEditorHistory()) return;
        runCommand('redo');
      };

      document.querySelectorAll('[data-command]').forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          if (button.dataset.command === 'undo') performUndo();
          else if (button.dataset.command === 'redo') performRedo();
          else runCommand(button.dataset.command);
        });
      });

      replaceFormatButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const currentIndex = FORMAT_STATE_ORDER.indexOf(replacementFormatState(button));
          const nextState = FORMAT_STATE_ORDER[(currentIndex + 1) % FORMAT_STATE_ORDER.length];
          setReplacementFormatState(button, nextState);
          updateReplacementFormatSummary();
        });
      });

      replaceFormatReset.addEventListener('click', () => {
        resetReplacementFormatStates();
        showToast('지정한 바꿀 서식을 모두 해제했습니다.');
      });

      selectionCommandButtons.forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          restoreSelection();
          runCommand(button.dataset.selectionCommand);
          saveSelection();
          showSelectionToolbar();
        });
      });

      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('mousedown', () => saveSelection());
        button.addEventListener('click', async () => {
          const action = button.dataset.action;
          if (action === 'new') {
            // 내용을 전부 지운 뒤라도 미저장 변경이면 확인을 받습니다.
            if ((editor.innerText.trim() || draftDirty)
              && !window.confirm('현재 문서를 지우고 새 문서를 만들까요?')) return;
            normalizeEmptyDocument(true);
            currentFileName = '새 문서';
            currentHtmlFileHandle = null;
            currentMarkdownFileHandle = null;
            currentDocxFileHandle = null;
            // innerHTML을 직접 바꾸므로 input 이벤트가 없습니다. 초안을 명시적으로
            // 비우지 않으면 비정상 종료 후 지운 문서가 되살아납니다.
            markDocumentClean();
            resetEditorHistory();
            updateCount();
            focusEditor();
          } else if (action === 'open') {
            await openDocument();
          } else if (action === 'save-html') {
            await saveHtmlDocument();
          } else if (action === 'save-md') {
            await saveMarkdownDocument();
          } else if (action === 'save-docx') {
            await saveDocxDocument();
          } else if (action === 'copy-all') {
            copyAllRich();
          } else if (action === 'print') {
            window.print();
          } else if (action === 'link') {
            insertLink();
          } else if (action === 'clear-format') {
            clearFormatting();
          } else if (action === 'quote') {
            toggleQuoteBlock();
          } else if (action === 'table') {
            openTablePicker();
          } else if (action === 'symbol') {
            openSymbolPicker();
          } else if (action === 'find') {
            openFindbar(false);
          } else if (action === 'replace') {
            openFindbar(true);
          }
        });
      });

      blockFormat.addEventListener('change', () => {
        runCommand('formatBlock', blockFormat.value);
      });

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        try {
          await loadDocumentFile(file);
        } catch (error) {
          showToast('파일을 열지 못했습니다.');
        } finally {
          fileInput.value = '';
        }
      });

      editor.addEventListener('beforeinput', (event) => {
        if (bulkEditing || applyingHistory || suppressingInputHistory || event.isComposing || composing) return;
        pendingInputBeforeHtml = editor.innerHTML;
        pendingInputHistoryGroup = ['insertText', 'deleteContentBackward', 'deleteContentForward']
          .includes(event.inputType)
          ? `${historyGroupSequence}:${event.inputType}`
          : '';
      });

      editor.addEventListener('input', (event) => {
        if (bulkEditing) return;
        hideSelectionToolbar();
        if (!event.isComposing) {
          normalizeEmptyDocument();
          updateFormattingControlsState();
        }
        if (!applyingHistory
          && !suppressingInputHistory
          && !event.isComposing
          && !composing
          && compositionBeforeHtml === null) {
          pushEditorHistory(
            pendingInputBeforeHtml ?? currentHistoryHtml,
            editor.innerHTML,
            pendingInputHistoryGroup
          );
          pendingInputBeforeHtml = null;
          pendingInputHistoryGroup = '';
        }
        updateCount();
      });
      editor.addEventListener('compositionstart', () => {
        breakEditorHistoryGroup();
        composing = true;
        compositionBeforeHtml = editor.innerHTML;
        pendingInputBeforeHtml = null;
      });
      editor.addEventListener('compositionend', () => {
        composing = false;
        normalizeEmptyDocument();
        updateFormattingControlsState();
        saveDraft();
        // Chromium은 compositionend 뒤에 마지막 input을 한 번 더 보낼 수 있습니다.
        // 같은 조합 입력을 두 번 기록하지 않도록 해당 input까지 지난 뒤 한 단계로
        // 이력에 넣습니다.
        setTimeout(() => {
          if (compositionBeforeHtml === null) return;
          pushEditorHistory(
            compositionBeforeHtml,
            editor.innerHTML,
            `${historyGroupSequence}:composition`
          );
          compositionBeforeHtml = null;
          breakEditorHistoryGroup();
        }, 0);
      });
      editor.addEventListener('mouseup', () => {
        breakEditorHistoryGroup();
        saveSelection();
        updateFormattingControlsState();
        setTimeout(showSelectionToolbar, 0);
      });
      editor.addEventListener('keyup', (event) => {
        if (event.isComposing) return;
        saveSelection();
        updateFormattingControlsState();
        showSelectionToolbar();
      });
      document.addEventListener('selectionchange', () => {
        if (composing) return;
        updateFormattingControlsState();
        if (selectionToolbar.classList.contains('visible')) showSelectionToolbar();
        if (findbar.classList.contains('open')) updateReplacementFormatPreview();
      });
      document.addEventListener('mousedown', (event) => {
        if (!selectionToolbar.contains(event.target)) hideSelectionToolbar();
        if (!tablePicker.contains(event.target) && !tableButton.contains(event.target)) closeTablePicker();
        if (!symbolPicker.contains(event.target) && !symbolButton.contains(event.target)) closeSymbolPicker();
      });

      document.querySelectorAll('[data-table-action]').forEach((button) => {
        button.addEventListener('click', () => {
          if (button.dataset.tableAction === 'close') closeTablePicker();
          if (button.dataset.tableAction === 'insert') insertTable(tableRows.value, tableColumns.value);
        });
      });

      symbolPicker.querySelector('[data-symbol-action="close"]').addEventListener('click', () => {
        closeSymbolPicker();
        focusEditor();
      });

      editor.addEventListener('keydown', (event) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown']
          .includes(event.key)) {
          breakEditorHistoryGroup();
        }
        if (event.key !== 'Tab') return;
        const cell = selectedTableCell();
        if (!cell) return;
        const table = cell.closest('table');
        const cells = [...table.querySelectorAll('th,td')];
        const index = cells.indexOf(cell);
        if (event.shiftKey && index === 0) return;

        event.preventDefault();
        let target = event.shiftKey ? cells[index - 1] : cells[index + 1];
        if (!target && !event.shiftKey) {
          target = appendTableRowUndoably(table);
        }
        placeCaretInCell(target);
      });

      editor.addEventListener('mouseover', (event) => {
        const anchor = event.target.closest?.('a');
        if (anchor && editor.contains(anchor) && anchor !== hoveredLink) showLinkPreview(anchor);
      });

      editor.addEventListener('mouseout', (event) => {
        const anchor = event.target.closest?.('a');
        if (!anchor) return;
        const next = event.relatedTarget;
        if (!next || (!anchor.contains(next) && !linkPreview.contains(next))) hideLinkPreview();
      });

      linkPreview.addEventListener('mouseleave', (event) => {
        const next = event.relatedTarget;
        if (hoveredLink && next && (next === hoveredLink || hoveredLink.contains(next))) return;
        hideLinkPreview();
      });
      linkPreviewCopy.addEventListener('click', copyPreviewUrl);

      editor.addEventListener('scroll', () => {
        hideLinkPreview();
        hideSelectionToolbar();
      });
      window.addEventListener('scroll', () => {
        hideLinkPreview();
        hideSelectionToolbar();
      }, true);
      window.addEventListener('resize', () => {
        hideLinkPreview();
        hideSelectionToolbar();
        closeTablePicker();
        closeSymbolPicker();
      });
      document.addEventListener('copy', handleEditorCopy);
      document.addEventListener('cut', handleEditorCut);

      editor.addEventListener('click', (event) => {
        const anchor = event.target.closest?.('a');
        if (!anchor || !editor.contains(anchor)) return;
        if (event.ctrlKey || event.metaKey) {
          event.preventDefault();
          window.open(anchor.href, '_blank', 'noopener,noreferrer');
          hideLinkPreview();
        }
      });

      // Ctrl+Shift+V는 서식 없이 붙여넣기입니다. paste 이벤트만으로는 두 조작을
      // 구분할 수 없으므로 키를 누른 시각을 기록해 판단합니다.
      let plainPasteRequestedAt = 0;

      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === 'v') {
          plainPasteRequestedAt = Date.now();
        }
      });

      const consumePlainPasteRequest = () => {
        const requested = Date.now() - plainPasteRequestedAt < 1000;
        plainPasteRequestedAt = 0;
        return requested;
      };

      // 원본 HTML의 블록 구조를 그대로 끼워 넣으면 문단이 쪼개지거나 붙여넣은
      // 내용 뒤에 빈 줄이 하나 더 생깁니다. 그래서 줄 구조는 Ctrl+Shift+V처럼
      // "보이는 줄 하나 = 문단 하나"로 다시 계산하고, 그 위에 굵게·기울임·밑줄·
      // 취소선·하이퍼링크만 구간별로 되살립니다. 글꼴·글자 크기·색처럼 문서 모양을
      // 흔드는 외부 서식은 가져오지 않습니다.
      // Ctrl+Shift+V는 서식 없이 글자만 붙여넣습니다.
      editor.addEventListener('paste', (event) => {
        event.preventDefault();
        const keepFormatting = !consumePlainPasteRequest();
        const selection = window.getSelection();
        const plain = event.clipboardData?.getData('text/plain') || '';
        const rich = event.clipboardData?.getData('text/html') || '';
        const linkCandidate = plain.trim();

        // 1) 텍스트를 선택한 상태에서 URL을 붙여넣으면 선택 영역을 링크로 감쌉니다.
        if (keepFormatting
          && selection
          && !selection.isCollapsed
          && isUrl(linkCandidate)
          && selectionIsInsideEditor()) {
          document.execCommand('createLink', false, linkCandidate);
          updateCount();
          return;
        }

        // 2) URL 단독 붙여넣기: 클릭 가능한 <a> 링크로 삽입합니다.
        if (keepFormatting && isUrl(linkCandidate) && !/[\r\n]/.test(plain)) {
          document.execCommand('insertHTML', false,
            `<a href="${escapeAttribute(linkCandidate)}">${escapeHtml(linkCandidate)}</a>`);
          updateCount();
          updateFormattingControlsState();
          return;
        }

        // 3) 줄 구조는 평문을 따르고, HTML에서 서식만 가져와 얹습니다.
        const htmlLines = rich ? clipboardLinesFromHtml(rich) : [];
        const lines = (plain && htmlLines.length
          ? alignClipboardLinesToPlainText(plain, htmlLines)
          : null) || htmlLines;
        if (lines.some((line) => line.some((runs) => runs.some((run) => run.text.trim())))) {
          insertClipboardTokens(clipboardTokensFromLines(lines, keepFormatting));
          updateFormattingControlsState();
          return;
        }
        if (!plain) {
          showToast('붙여넣을 내용을 찾지 못했습니다.');
          return;
        }
        insertPlainTextPreservingBreaks(plain);
      });

      document.querySelectorAll('[data-find]').forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.find;
          if (action === 'close') closeFindbar();
          if (action === 'next') findNext();
          if (action === 'previous') findPrevious();
          if (action === 'replace') replaceCurrent();
          if (action === 'replace-all') replaceAll();
        });
      });

      // Enter는 입력칸에 포커스를 남기므로 계속 눌러 다음 일치로 넘어갈 수 있습니다.
      // 찾은 자리에서 바로 고치려면 Tab이나 클릭으로 본문에 들어가거나 F3을 씁니다.
      findText.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          if (event.shiftKey) findPreviousKeepingFocus();
          else findNextKeepingFocus();
        }
        if (event.key === 'Escape') closeFindbar();
      });

      replaceText.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          replaceCurrent();
        }
        if (event.key === 'Escape') closeFindbar();
      });

      replaceText.addEventListener('input', () => {
        updateReplacementFormatSummary();
        scheduleFindCount();
      });
      findText.addEventListener('input', () => {
        // 찾을 내용이 바뀌면 이전 검색 위치는 의미가 없습니다.
        specialSearchState = { query: '', nextIndex: 0, index: -1, range: null };
        updateReplacementFormatPreview();
        scheduleFindCount();
      });

      matchCase.addEventListener('change', () => {
        specialSearchState = { query: '', nextIndex: 0, index: -1, range: null };
        updateFindCount();
      });

      document.addEventListener('keydown', async (event) => {
        const ctrl = event.ctrlKey || event.metaKey;
        const key = event.key.toLowerCase();
        if (event.key === 'Escape' && tablePicker.classList.contains('open')) {
          event.preventDefault();
          closeTablePicker();
          focusEditor();
          return;
        }
        if (event.key === 'Escape' && symbolPicker.classList.contains('open')) {
          event.preventDefault();
          closeSymbolPicker();
          focusEditor();
          return;
        }
        // 찾기는 일치 구간을 편집기에서 선택하므로 포커스가 본문으로 갑니다.
        // 그 상태에서 Enter는 줄바꿈이어야 하니, 이어서 찾을 때는 F3을 씁니다.
        if (event.key === 'F3' && findText.value) {
          event.preventDefault();
          if (event.shiftKey) findPrevious();
          else findNext();
          return;
        }
        if (!ctrl) return;
        if (key === 'g' && findText.value) {
          event.preventDefault();
          if (event.shiftKey) findPrevious();
          else findNext();
          return;
        }
        if (key === 'z' && !event.shiftKey) {
          if (undoEditorHistory()) event.preventDefault();
          return;
        }
        if (key === 'y' || (key === 'z' && event.shiftKey)) {
          if (redoEditorHistory()) event.preventDefault();
          return;
        }
        if (key === 'k') {
          event.preventDefault();
          saveSelection();
          insertLink();
        } else if (key === 'h') {
          event.preventDefault();
          openFindbar(true);
        } else if (key === 'f') {
          event.preventDefault();
          openFindbar(false);
        } else if (key === 's' && !event.shiftKey) {
          event.preventDefault();
          await saveHtmlDocument();
        }
      });

      // ===== 자동 저장 및 이탈 경고 =====
      const DRAFT_KEY = 'basic-text-editor-draft';
      const DRAFT_SAVE_DELAY = 700;
      let draftDirty = false;
      let draftSaveTimer = null;

      const cancelScheduledDraftSave = () => {
        if (draftSaveTimer === null) return;
        clearTimeout(draftSaveTimer);
        draftSaveTimer = null;
      };

      const saveDraft = () => {
        cancelScheduledDraftSave();
        try {
          localStorage.setItem(DRAFT_KEY, editor.innerHTML);
        } catch (error) {
          // 용량 초과 등 저장 실패 시 조용히 무시합니다.
        }
      };

      const scheduleDraftSave = () => {
        cancelScheduledDraftSave();
        draftSaveTimer = setTimeout(() => {
          draftSaveTimer = null;
          if (draftDirty && !composing) saveDraft();
        }, DRAFT_SAVE_DELAY);
      };

      // 파일에 실제로 기록됐음을 확인한 경우에만 복구 초안을 버립니다.
      const markDocumentClean = () => {
        cancelScheduledDraftSave();
        draftDirty = false;
        try {
          localStorage.removeItem(DRAFT_KEY);
        } catch (error) {
          // 접근 불가 시 무시합니다.
        }
      };

      // 블롭 다운로드는 성공 여부를 알 수 없습니다. 브라우저나 확장 프로그램이
      // 다운로드를 조용히 차단해도 예외가 발생하지 않기 때문에, 여기서 초안을
      // 지우면 파일도 없고 복구 수단도 없는 상태가 됩니다.
      // 그래서 이탈 경고만 끄고 복구 초안은 남겨 둡니다.
      const markDocumentSavedUnverified = () => {
        saveDraft();
        draftDirty = false;
      };

      const confirmDiscardChanges = () => !draftDirty
        || window.confirm('저장하지 않은 변경 내용이 있습니다. 현재 문서를 닫고 다른 파일을 여시겠습니까?');

      const markDocumentDirty = () => {
        draftDirty = true;
        if (!bulkEditing && !composing) scheduleDraftSave();
      };

      // 복구는 조용히 일어나면 안 됩니다. 사용자가 직접 지운 내용이 되살아난
      // 것인지, 비정상 종료에서 살아난 것인지 구분할 수 있게 알려 줍니다.
      const restoreDraft = () => {
        try {
          const saved = localStorage.getItem(DRAFT_KEY);
          if (saved && !editor.textContent.replace(/\u200B/g, '').trim()) {
            editor.innerHTML = saved;
            draftDirty = true;
            showToast('저장하지 않은 내용을 복구했습니다.');
          }
        } catch (error) {
          // 접근 불가 시 무시합니다.
        }
      };

      restoreDraft();
      resetEditorHistory();

      editor.addEventListener('input', () => {
        // 글자를 고치면 일치 개수와 다음 검색 위치를 다시 계산해야 합니다.
        invalidateFindResultsAfterDocumentChange();
        markDocumentDirty();
      });

      window.addEventListener('beforeunload', (event) => {
        if (draftDirty) {
          saveDraft();
          event.preventDefault();
          event.returnValue = '';
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && draftDirty) saveDraft();
      });
      // ===== 자동 저장 및 이탈 경고 끝 =====

      // 서식 명령이 <span style="font-weight:bold"> 대신 <b> 같은 태그를 만들게
      // 합니다. 이 편집기의 저장·복사·찾아 바꾸기가 모두 태그를 기준으로
      // 동작하므로 태그로 통일하는 편이 정확합니다.
      try {
        document.execCommand('styleWithCSS', false, false);
      } catch (error) {
        // 지원하지 않는 브라우저에서는 무시합니다.
      }

      resetReplacementFormatStates();
      updateCount();
      updateFormattingControlsState();
    })();
  </script>
</body>
</html>
