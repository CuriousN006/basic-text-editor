<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 리치 라이터</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f5;
      --panel: #ffffff;
      --line: #d7dce3;
      --text: #202124;
      --muted: #69707a;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --danger: #b42318;
      --shadow: 0 12px 40px rgba(32, 33, 36, .12);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    }

    button, select, input {
      font: inherit;
    }

    .topbar {
      flex: 0 0 auto;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 8px rgba(32, 33, 36, .06);
      z-index: 10;
    }

    .filebar,
    .formatbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 7px 12px;
    }

    .filebar {
      border-bottom: 1px solid #edf0f3;
    }

    .brand {
      margin-right: 8px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .toolbar-button,
    .toolbar-select {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
    }

    .toolbar-button {
      min-width: 36px;
      padding: 6px 9px;
      cursor: pointer;
    }

    .toolbar-button:hover,
    .toolbar-button:focus-visible,
    .toolbar-select:hover,
    .toolbar-select:focus-visible {
      border-color: var(--line);
      background: #f5f7fa;
      outline: none;
    }

    .toolbar-button:active {
      background: var(--accent-soft);
    }

    .toolbar-button.is-active,
    .toolbar-button[aria-pressed="true"] {
      border-color: #93c5fd;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .toolbar-button.primary {
      background: var(--accent);
      color: white;
    }

    .toolbar-button.primary:hover,
    .toolbar-button.primary:focus-visible {
      background: #1d4ed8;
    }

    .toolbar-select {
      padding: 5px 28px 5px 9px;
      cursor: pointer;
    }

    .separator {
      width: 1px;
      height: 25px;
      margin: 0 2px;
      background: var(--line);
    }

    .workspace {
      flex: 1 1 auto;
      overflow: auto;
      padding: 28px 16px 80px;
    }

    .page {
      width: min(820px, 100%);
      min-height: 1050px;
      margin: 0 auto;
      padding: 72px 78px 110px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    #editor {
      min-height: 850px;
      outline: none;
      font-family: "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      tab-size: 4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #editor:empty::before {
      color: #9aa0a6;
      content: "여기에 글을 입력하거나 마크다운 파일을 여세요…";
      pointer-events: none;
    }

    #editor p {
      margin: 0 0 1em;
    }

    #editor p.blank-line {
      min-height: 1.75em;
      margin: 0;
    }

    #editor h1 { font-size: 2em; margin: 1.1em 0 .55em; }
    #editor h2 { font-size: 1.55em; margin: 1.15em 0 .55em; }
    #editor h3 { font-size: 1.25em; margin: 1.1em 0 .5em; }
    #editor ul, #editor ol { margin: .4em 0 1em; padding-left: 1.8em; }
    #editor blockquote {
      margin: 1em 0;
      padding: .5em 1em;
      border-left: 4px solid #94a3b8;
      background: #f8fafc;
      color: #475569;
    }
    #editor pre {
      overflow-x: auto;
      padding: 14px 16px;
      border-radius: 8px;
      background: #f4f5f7;
      font: 14px/1.55 Consolas, monospace;
    }
    #editor code {
      padding: .1em .3em;
      border-radius: 4px;
      background: #f1f3f4;
      font-family: Consolas, monospace;
    }
    #editor pre code { padding: 0; background: transparent; }
    #editor a { color: #1558d6; text-decoration: underline; }
    #editor hr { margin: 2em 0; border: 0; border-top: 1px solid #cdd2d9; }
    #editor img { max-width: 100%; height: auto; }
    #editor table {
      width: 100%;
      margin: .8em 0 1em;
      border-collapse: collapse;
      table-layout: fixed;
    }
    #editor th,
    #editor td {
      min-width: 48px;
      padding: 8px 10px;
      border: 1px solid #9ca3af;
      text-align: left;
      vertical-align: top;
    }
    #editor th {
      background: #f1f5f9;
      font-weight: 700;
    }

    .link-preview {
      display: none;
      position: fixed;
      max-width: min(520px, calc(100vw - 24px));
      padding: 9px 11px;
      border: 1px solid #c9d1dc;
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 7px 24px rgba(32, 33, 36, .18);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: auto;
      user-select: text;
      z-index: 40;
    }

    .link-preview.visible { display: block; }

    .link-preview::before {
      position: absolute;
      top: -14px;
      right: -10px;
      left: -10px;
      height: 14px;
      background: transparent;
      content: "";
    }

    .link-preview.above::before {
      top: auto;
      bottom: -14px;
    }

    .link-preview-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .link-preview-url {
      display: block;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: #1558d6;
      font-weight: 600;
      text-overflow: ellipsis;
      text-decoration: underline;
      white-space: nowrap;
    }

    .link-preview-copy {
      flex: none;
      padding: 3px 7px;
      border: 1px solid #c9d1dc;
      border-radius: 5px;
      background: #f8fafc;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    .link-preview-copy:hover,
    .link-preview-copy:focus-visible {
      border-color: #93c5fd;
      background: var(--accent-soft);
      outline: none;
    }

    .link-preview-hint {
      display: block;
      margin-top: 2px;
      color: var(--muted);
    }

    .selection-toolbar {
      display: none;
      position: fixed;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border: 1px solid #c9d1dc;
      border-radius: 9px;
      background: #ffffff;
      box-shadow: 0 7px 24px rgba(32, 33, 36, .18);
      z-index: 35;
    }

    .selection-toolbar.visible { display: flex; }

    .table-picker {
      display: none;
      position: fixed;
      width: 286px;
      padding: 12px;
      border: 1px solid #c9d1dc;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: var(--shadow);
      z-index: 36;
    }

    .table-picker.open { display: block; }

    .table-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .table-picker-close {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .table-picker-close:hover,
    .table-picker-close:focus-visible { background: #f1f5f9; outline: none; }

    .table-grid {
      display: grid;
      grid-template-columns: repeat(10, 21px);
      gap: 4px;
      width: max-content;
      margin: 0 auto;
    }

    .table-grid-cell {
      width: 21px;
      height: 21px;
      padding: 0;
      border: 1px solid #aeb7c4;
      background: #ffffff;
      cursor: pointer;
    }

    .table-grid-cell.active {
      border-color: #2563eb;
      background: #bfdbfe;
    }

    .table-size-label {
      margin: 8px 0 10px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .table-direct {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
    }

    .table-direct label {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .table-direct input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .table-header-option {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 9px 0;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .table-picker-actions { display: flex; justify-content: flex-end; }

    .symbol-picker {
      display: none;
      position: fixed;
      width: min(360px, calc(100vw - 24px));
      max-height: min(520px, calc(100vh - 24px));
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #c9d1dc;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: var(--shadow);
      z-index: 36;
    }

    .symbol-picker.open { display: block; }

    .symbol-category + .symbol-category {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
    }

    .symbol-category-title {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(30px, 1fr));
      gap: 5px;
    }

    .symbol-button {
      min-width: 0;
      height: 34px;
      padding: 0;
      border: 1px solid #d7dce3;
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      font-family: "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
      font-size: 18px;
      line-height: 1;
    }

    .symbol-button:hover,
    .symbol-button:focus-visible {
      border-color: #93c5fd;
      background: var(--accent-soft);
      color: var(--accent);
      outline: none;
    }

    .mini-format-button {
      min-width: 30px;
      min-height: 30px;
      padding: 4px 7px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .mini-format-button:hover,
    .mini-format-button:focus-visible,
    .mini-format-button[aria-pressed="true"] {
      border-color: #93c5fd;
      background: var(--accent-soft);
      color: var(--accent);
      outline: none;
    }

    .mini-format-button[data-format-state="apply"] {
      border-color: #93c5fd;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .mini-format-button[data-format-state="remove"] {
      border-color: #cbd5e1;
      background: #eceff3;
      color: var(--muted);
      text-decoration: line-through;
    }

    .mini-format-button[data-format-state="remove"]:hover,
    .mini-format-button[data-format-state="remove"]:focus-visible {
      border-color: #94a3b8;
      background: #dfe4ea;
      color: var(--muted);
      outline: none;
    }

    .replace-formats-reset {
      min-height: 30px;
      margin-left: auto;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }

    .replace-formats-reset:hover:not(:disabled),
    .replace-formats-reset:focus-visible:not(:disabled) {
      border-color: #93c5fd;
      background: var(--accent-soft);
      outline: none;
    }

    .replace-formats-reset:disabled {
      color: #9aa0a6;
      cursor: default;
      opacity: .6;
    }

    .findbar {
      display: none;
      position: fixed;
      top: 104px;
      right: 22px;
      width: min(460px, calc(100vw - 32px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
      z-index: 20;
    }

    .findbar.open { display: block; }

    .find-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin-bottom: 7px;
    }

    /* 찾을 내용 줄은 입력칸 · 일치 개수 · 닫기 버튼 세 칸입니다.
       :has()는 문서 전체 스타일 무효화를 유발하므로 클래스로 지정합니다. */
    .find-row.has-count {
      grid-template-columns: 1fr auto auto;
    }

    .find-row:last-child { margin-bottom: 0; }

    .find-input {
      width: 100%;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
    }

    .find-input:focus { border-color: var(--accent); }

    .find-count {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 62px;
      padding: 0 2px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      user-select: none;
    }

    .find-count.is-empty { color: var(--danger); }

    /* 찾기 입력칸에 포커스가 있는 동안 찾은 구간을 표시합니다.
       선택 영역은 편집기가 포커스를 잃으면 그려지지 않습니다. */
    ::highlight(find-match) {
      background-color: #fde68a;
      color: #202124;
    }

    .particle-option {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      margin: -1px 0 8px;
      padding: 0 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .particle-option input {
      margin: 0;
      accent-color: var(--accent);
    }

    .find-specials {
      margin: 1px 0 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .find-specials code {
      color: var(--text);
      font-family: Consolas, monospace;
    }

    .replace-formats {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .replace-formats-label { margin-right: 2px; }




    .find-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .statusbar {
      position: fixed;
      right: 16px;
      bottom: 12px;
      display: flex;
      gap: 10px;
      padding: 6px 10px;
      border: 1px solid rgba(215, 220, 227, .8);
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 12px;
      box-shadow: 0 4px 18px rgba(32, 33, 36, .08);
      backdrop-filter: blur(8px);
      z-index: 12;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translate(-50%, 20px);
      padding: 10px 15px;
      border-radius: 8px;
      background: #202124;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .brand { width: 100%; }
      .workspace { padding: 0 0 70px; }
      .page {
        min-height: 100%;
        padding: 40px 24px 90px;
        box-shadow: none;
      }
      .findbar { top: 150px; }
    }

    @media print {
      body { display: block; overflow: visible; background: white; }
      .topbar, .findbar, .selection-toolbar, .table-picker, .symbol-picker, .statusbar, .toast { display: none !important; }
      .workspace { overflow: visible; padding: 0; }
      .page { width: auto; min-height: auto; padding: 0; box-shadow: none; }
      #editor { min-height: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="filebar">
      <span class="brand">오프라인 리치 라이터</span>
      <button class="toolbar-button" type="button" data-action="new" title="새 문서">새 문서</button>
      <button class="toolbar-button" type="button" data-action="open" title="마크다운·HTML·텍스트 열기">파일 열기</button>
      <button class="toolbar-button" type="button" data-action="save-html" title="HTML로 저장 (Ctrl+S)">HTML 저장</button>
      <button class="toolbar-button" type="button" data-action="save-md" title="마크다운으로 저장">MD 저장</button>
      <button class="toolbar-button" type="button" data-action="save-docx" title="Microsoft Word 문서로 저장">DOCX 저장</button>
      <span class="separator" aria-hidden="true"></span>
      <button class="toolbar-button primary" type="button" data-action="copy-all" title="문서 전체를 서식 있게 복사">전체 서식 복사</button>
      <button class="toolbar-button" type="button" data-action="print" title="인쇄 또는 PDF 저장">인쇄</button>
      <input id="fileInput" class="sr-only" type="file" accept=".md,.markdown,.txt,.html,.htm,text/markdown,text/plain,text/html">
    </div>
    <div class="formatbar" aria-label="서식 도구">
      <button class="toolbar-button" type="button" data-command="undo" title="실행 취소 (Ctrl+Z)">↶</button>
      <button class="toolbar-button" type="button" data-command="redo" title="다시 실행 (Ctrl+Y)">↷</button>
      <span class="separator" aria-hidden="true"></span>
      <select id="blockFormat" class="toolbar-select" title="문단 종류">
        <option value="P">본문</option>
        <option value="H1">제목 1</option>
        <option value="H2">제목 2</option>
        <option value="H3">제목 3</option>
        <option value="BLOCKQUOTE">인용문</option>
        <option value="PRE">코드 블록</option>
      </select>
      <button class="toolbar-button" type="button" data-command="bold" aria-pressed="false" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button class="toolbar-button" type="button" data-command="italic" aria-pressed="false" title="기울임 (Ctrl+I)"><i>I</i></button>
      <button class="toolbar-button" type="button" data-command="underline" aria-pressed="false" title="밑줄 (Ctrl+U)"><u>U</u></button>
      <button class="toolbar-button" type="button" data-command="strikeThrough" aria-pressed="false" title="취소선"><s>S</s></button>
      <span class="separator" aria-hidden="true"></span>
      <button class="toolbar-button" type="button" data-command="justifyLeft" aria-pressed="false" title="왼쪽 정렬">왼쪽</button>
      <button class="toolbar-button" type="button" data-command="justifyCenter" aria-pressed="false" title="가운데 정렬">가운데</button>
      <button class="toolbar-button" type="button" data-command="justifyRight" aria-pressed="false" title="오른쪽 정렬">오른쪽</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="quoteButton" class="toolbar-button" type="button" data-action="quote" aria-pressed="false" title="인용구 블록">❝ 인용</button>
      <button class="toolbar-button" type="button" data-command="insertUnorderedList" aria-pressed="false" title="글머리 기호 목록">• 목록</button>
      <button class="toolbar-button" type="button" data-command="insertOrderedList" aria-pressed="false" title="번호 목록">1. 목록</button>
      <button id="symbolButton" class="toolbar-button" type="button" data-action="symbol" title="문자 기호 삽입">Ω 기호</button>
      <button class="toolbar-button" type="button" data-action="link" title="하이퍼링크 (Ctrl+K)">🔗</button>
      <button class="toolbar-button" type="button" data-command="unlink" title="링크 제거">링크 해제</button>
      <button class="toolbar-button" type="button" data-action="clear-format" title="글자 및 문단 서식 제거">서식 제거</button>
      <button class="toolbar-button" type="button" data-command="insertHorizontalRule" title="구분선">―</button>
      <button id="tableButton" class="toolbar-button" type="button" data-action="table" title="표 삽입">▦ 표</button>
      <span class="separator" aria-hidden="true"></span>
      <button class="toolbar-button" type="button" data-action="find" title="찾기 (Ctrl+F)">찾기</button>
      <button class="toolbar-button" type="button" data-action="replace" title="찾아 바꾸기 (Ctrl+H)">바꾸기</button>
    </div>
  </header>

  <main class="workspace">
    <article class="page">
      <div id="editor" contenteditable="true" spellcheck="true" aria-label="문서 편집 영역"><p><br></p></div>
    </article>
  </main>

  <section id="findbar" class="findbar" aria-label="찾기 및 바꾸기">
    <div class="find-row has-count">
      <input id="findText" class="find-input" type="text" placeholder="찾을 내용" autocomplete="off" title="바꾸기에서는 찾은 글자의 현재 서식이 이 칸에 그대로 표시됩니다.">
      <span id="findCount" class="find-count" aria-live="polite" aria-atomic="true"></span>
      <button class="toolbar-button" type="button" data-find="close" tabindex="-1" title="닫기">✕</button>
    </div>
    <div id="replaceRow" class="find-row">
      <input id="replaceText" class="find-input" type="text" placeholder="바꿀 내용" autocomplete="off" title="바꿀 서식을 적용한 결과가 이 칸에 그대로 표시됩니다.">
    </div>
    <label id="particleOption" class="particle-option" title="바꾼 단어의 받침에 맞춰 바로 뒤의 조사를 교정합니다.">
      <input id="adjustParticles" type="checkbox" checked>
      조사 자동 교정
    </label>
    <label class="particle-option" title="끄면 영문 대문자와 소문자를 같은 글자로 봅니다.">
      <input id="matchCase" type="checkbox" checked>
      대소문자 구분
    </label>
    <div id="replaceFormats" class="replace-formats" aria-label="바꿀 내용 서식">
      <span class="replace-formats-label">바꿀 서식</span>
      <button class="mini-format-button" type="button" data-replace-format="bold" data-format-state="none"><b>B</b></button>
      <button class="mini-format-button" type="button" data-replace-format="italic" data-format-state="none"><i>I</i></button>
      <button class="mini-format-button" type="button" data-replace-format="underline" data-format-state="none"><u>U</u></button>
      <button class="mini-format-button" type="button" data-replace-format="strikeThrough" data-format-state="none"><s>S</s></button>
      <button id="replaceFormatReset" class="replace-formats-reset" type="button" data-format-reset title="지정한 바꿀 서식 설정을 초기화합니다.">서식 설정 초기화</button>
    </div>
    <div id="replaceFormatHint" class="find-specials" aria-live="polite"></div>

    <div class="find-specials">
      특수기호: <code>^p</code> 문단 · <code>^l</code> 줄바꿈 · <code>^t</code> 탭 · <code>^^</code> ^ 문자
    </div>
    <div class="find-specials">
      이어서 찾기: <code>Enter</code> 다음 · <code>Shift+Enter</code> 이전 · 본문 편집 중에는 <code>F3</code>
    </div>
    <div id="findActions" class="find-actions">
      <button class="toolbar-button" type="button" data-find="previous" title="이전 일치로 이동 (Shift+Enter)">이전 찾기</button>
      <button class="toolbar-button" type="button" data-find="next">다음 찾기</button>
      <button class="toolbar-button" type="button" data-find="replace">바꾸기</button>
      <button class="toolbar-button" type="button" data-find="replace-all">모두 바꾸기</button>
    </div>
  </section>

  <section id="tablePicker" class="table-picker" role="dialog" aria-label="표 삽입" aria-hidden="true">
    <div class="table-picker-header">
      <span>표 삽입</span>
      <button class="table-picker-close" type="button" data-table-action="close" title="닫기">✕</button>
    </div>
    <!-- role="grid"는 row 래퍼를 요구합니다. 여기서는 버튼 묶음이므로 group을 씁니다. -->
    <div id="tableGrid" class="table-grid" role="group" aria-label="행과 열 선택"></div>
    <div id="tableSizeLabel" class="table-size-label">1행 × 1열</div>
    <div class="table-direct">
      <label>행 <input id="tableRows" type="number" min="1" max="50" value="2"></label>
      <label>열 <input id="tableColumns" type="number" min="1" max="20" value="2"></label>
    </div>
    <label class="table-header-option">
      <input id="tableHeaderRow" type="checkbox">
      첫 행을 제목 행으로 사용
    </label>
    <div class="table-picker-actions">
      <button class="toolbar-button primary" type="button" data-table-action="insert">표 삽입</button>
    </div>
  </section>

  <section id="symbolPicker" class="symbol-picker" role="dialog" aria-label="문자 기호 삽입" aria-hidden="true">
    <div class="table-picker-header">
      <span>문자 기호 삽입</span>
      <button class="table-picker-close" type="button" data-symbol-action="close" title="닫기">✕</button>
    </div>
    <div class="symbol-category">
      <span class="symbol-category-title">글머리·강조 문자</span>
      <div class="symbol-grid" data-symbol-group="bullets"></div>
    </div>
    <div class="symbol-category">
      <span class="symbol-category-title">작품명·인용 괄호</span>
      <div class="symbol-grid" data-symbol-group="works"></div>
    </div>
    <div class="symbol-category">
      <span class="symbol-category-title">화살표</span>
      <div class="symbol-grid" data-symbol-group="arrows"></div>
    </div>
  </section>

  <!-- 글자 수가 바뀔 때마다 읽어 주면 입력을 방해하므로 aria-live를 두지 않습니다. -->
  <div class="statusbar">
    <span id="fileName">새 문서</span>
    <span id="count">0자 · 0단어</span>
  </div>
  <div id="linkPreview" class="link-preview" role="dialog" aria-label="링크 정보">
    <div class="link-preview-main">
      <a id="linkPreviewUrl" class="link-preview-url" target="_blank" rel="noopener noreferrer"></a>
      <button id="linkPreviewCopy" class="link-preview-copy" type="button">주소 복사</button>
    </div>
    <span class="link-preview-hint">링크 열기 또는 주소 복사</span>
  </div>
  <div id="selectionToolbar" class="selection-toolbar" role="toolbar" aria-label="선택한 글자 빠른 서식">
    <button class="mini-format-button" type="button" data-selection-command="bold" aria-pressed="false" title="굵게 (Ctrl+B)"><b>B</b></button>
    <button class="mini-format-button" type="button" data-selection-command="italic" aria-pressed="false" title="기울임 (Ctrl+I)"><i>I</i></button>
    <button class="mini-format-button" type="button" data-selection-command="underline" aria-pressed="false" title="밑줄 (Ctrl+U)"><u>U</u></button>
    <button class="mini-format-button" type="button" data-selection-command="strikeThrough" aria-pressed="false" title="취소선"><s>S</s></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const editor = document.getElementById('editor');
      const workspace = document.querySelector('.workspace');
      const fileInput = document.getElementById('fileInput');
      const fileNameLabel = document.getElementById('fileName');
      const countLabel = document.getElementById('count');
      const toast = document.getElementById('toast');
      const findbar = document.getElementById('findbar');
      const findText = document.getElementById('findText');
      const findCount = document.getElementById('findCount');
      const matchCase = document.getElementById('matchCase');
      const replaceText = document.getElementById('replaceText');
      const particleOption = document.getElementById('particleOption');
      const replaceRow = document.getElementById('replaceRow');
      const replaceFormats = document.getElementById('replaceFormats');
      const replaceFormatButtons = [...document.querySelectorAll('[data-replace-format]')];
      const replaceFormatReset = document.getElementById('replaceFormatReset');
      const replaceFormatHint = document.getElementById('replaceFormatHint');
      const findActions = document.getElementById('findActions');
      // 찾기 전용 모드에서는 바꾸기 버튼을 문서에서 떼어 둡니다.
      const replaceOnlyButtons = [...findActions.querySelectorAll('[data-find^="replace"]')];

      const adjustParticles = document.getElementById('adjustParticles');
      const blockFormat = document.getElementById('blockFormat');
      const quoteButton = document.getElementById('quoteButton');
      const statefulCommandButtons = [...document.querySelectorAll('[data-command][aria-pressed]')];
      const supportedBlockFormats = new Set(['P', 'H1', 'H2', 'H3', 'BLOCKQUOTE', 'PRE']);
      const selectionToolbar = document.getElementById('selectionToolbar');
      const selectionCommandButtons = [...document.querySelectorAll('[data-selection-command]')];
      const tableButton = document.getElementById('tableButton');
      const tablePicker = document.getElementById('tablePicker');
      const tableGrid = document.getElementById('tableGrid');
      const tableSizeLabel = document.getElementById('tableSizeLabel');
      const tableRows = document.getElementById('tableRows');
      const tableColumns = document.getElementById('tableColumns');
      const tableHeaderRow = document.getElementById('tableHeaderRow');
      const symbolButton = document.getElementById('symbolButton');
      const symbolPicker = document.getElementById('symbolPicker');
      const linkPreview = document.getElementById('linkPreview');
      const linkPreviewUrl = document.getElementById('linkPreviewUrl');
      const linkPreviewCopy = document.getElementById('linkPreviewCopy');
      let currentFileName = '새 문서';
      let currentHtmlFileHandle = null;
      let currentMarkdownFileHandle = null;
      let currentDocxFileHandle = null;
      let toastTimer = null;
      let savedRange = null;
      let hoveredLink = null;
      let specialSearchState = { query: '', nextIndex: 0, index: -1, range: null };
      let findbarReplaceMode = false;
      let composing = false;
      let bulkEditing = false;

      const showToast = (message) => {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      };

      const updateCount = () => {
        const text = editor.innerText.replace(/\u200B/g, '').trim();
        const characters = text.length;
        const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
        countLabel.textContent = `${characters.toLocaleString()}자 · ${words.toLocaleString()}단어`;
        fileNameLabel.textContent = currentFileName;
      };

      const focusEditor = () => {
        editor.focus({ preventScroll: true });
      };

      const runCommand = (command, value = null) => {
        focusEditor();
        document.execCommand(command, false, value);
        updateCount();
        updateFormattingControlsState();
      };

      const selectionIsInsideEditor = () => {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) return false;
        const node = selection.getRangeAt(0).commonAncestorContainer;
        return node === editor || editor.contains(node.nodeType === Node.TEXT_NODE ? node.parentNode : node);
      };

      const updateFormattingControlsState = () => {
        const selectionInside = selectionIsInsideEditor();
        quoteButton.classList.remove('is-active');
        quoteButton.setAttribute('aria-pressed', 'false');
        statefulCommandButtons.forEach((button) => {
          let isActive = false;
          if (selectionInside) {
            try {
              isActive = document.queryCommandState(button.dataset.command);
            } catch (error) {
              isActive = false;
            }
          }
          button.classList.toggle('is-active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
        });

        if (!selectionInside) return;
        let currentBlock = 'P';
        try {
          currentBlock = String(document.queryCommandValue('formatBlock') || 'P')
            .replace(/[<>]/g, '')
            .toUpperCase();
        } catch (error) {
          currentBlock = 'P';
        }
        if (currentBlock === 'DIV') currentBlock = 'P';
        blockFormat.value = supportedBlockFormats.has(currentBlock) ? currentBlock : 'P';
        const isQuote = currentBlock === 'BLOCKQUOTE';
        quoteButton.classList.toggle('is-active', isQuote);
        quoteButton.setAttribute('aria-pressed', String(isQuote));
      };

      const hideSelectionToolbar = () => {
        selectionToolbar.classList.remove('visible');
      };

      const SYMBOL_GROUPS = {
        bullets: ['•', '◦', '▪', '▫', '‣', '⁃', '·', '※', '◆', '◇', '★', '☆', '✓', '✔'],
        works: ['《', '》', '〈', '〉', '『', '』', '「', '」', '【', '】', '〔', '〕'],
        arrows: ['←', '↑', '→', '↓', '↔', '↕', '↖', '↗', '↘', '↙', '⇐', '⇒', '⇔', '➜', '➝', '➞', '➡']
      };

      const closeSymbolPicker = () => {
        symbolPicker.classList.remove('open');
        symbolPicker.setAttribute('aria-hidden', 'true');
      };

      const closeTablePicker = () => {
        tablePicker.classList.remove('open');
        tablePicker.setAttribute('aria-hidden', 'true');
      };

      const updateTableGridHighlight = (rows, columns) => {
        const safeRows = Math.max(1, Math.min(8, Number(rows) || 1));
        const safeColumns = Math.max(1, Math.min(10, Number(columns) || 1));
        tableGrid.querySelectorAll('[data-table-row]').forEach((cell) => {
          const active = Number(cell.dataset.tableRow) <= safeRows
            && Number(cell.dataset.tableColumn) <= safeColumns;
          cell.classList.toggle('active', active);
        });
        tableSizeLabel.textContent = `${safeRows}행 × ${safeColumns}열`;
      };

      const positionTablePicker = () => {
        const buttonRect = tableButton.getBoundingClientRect();
        const pickerRect = tablePicker.getBoundingClientRect();
        const left = Math.min(
          Math.max(8, buttonRect.left),
          window.innerWidth - pickerRect.width - 8
        );
        const below = buttonRect.bottom + 7;
        const top = below + pickerRect.height <= window.innerHeight - 8
          ? below
          : Math.max(8, buttonRect.top - pickerRect.height - 7);
        tablePicker.style.left = `${left}px`;
        tablePicker.style.top = `${top}px`;
      };

      const openTablePicker = () => {
        hideSelectionToolbar();
        findbar.classList.remove('open');
        closeSymbolPicker();
        tablePicker.classList.add('open');
        tablePicker.setAttribute('aria-hidden', 'false');
        updateTableGridHighlight(1, 1);
        positionTablePicker();
      };

      const positionSymbolPicker = () => {
        const buttonRect = symbolButton.getBoundingClientRect();
        const pickerRect = symbolPicker.getBoundingClientRect();
        const left = Math.min(
          Math.max(8, buttonRect.left),
          window.innerWidth - pickerRect.width - 8
        );
        const below = buttonRect.bottom + 7;
        const top = below + pickerRect.height <= window.innerHeight - 8
          ? below
          : Math.max(8, buttonRect.top - pickerRect.height - 7);
        symbolPicker.style.left = `${left}px`;
        symbolPicker.style.top = `${top}px`;
      };

      const openSymbolPicker = () => {
        hideSelectionToolbar();
        findbar.classList.remove('open');
        closeTablePicker();
        symbolPicker.classList.add('open');
        symbolPicker.setAttribute('aria-hidden', 'false');
        positionSymbolPicker();
        symbolPicker.querySelector('[data-symbol]')?.focus({ preventScroll: true });
      };

      const insertLiteralSymbol = (symbol) => {
        if (!symbol) return;
        const beforeHtml = editor.innerHTML;
        restoreSelection();
        // execCommand('insertText')는 브라우저에 따라 input만 발생시키고 beforeinput은
        // 생략합니다. 그러면 공용 이력이 삽입 직전 문서를 알 수 없으므로 이 명령은
        // 전후 스냅숏을 직접 한 단계로 기록합니다.
        breakEditorHistoryGroup();
        pendingInputBeforeHtml = null;
        pendingInputHistoryGroup = '';
        suppressingInputHistory = true;
        try {
          runCommand('insertText', symbol);
        } finally {
          suppressingInputHistory = false;
        }
        pushEditorHistory(beforeHtml, editor.innerHTML);
        breakEditorHistoryGroup();
        saveSelection();
        closeSymbolPicker();
      };

      const toggleQuoteBlock = () => {
        restoreSelection();
        let currentBlock = 'P';
        try {
          currentBlock = String(document.queryCommandValue('formatBlock') || 'P')
            .replace(/[<>]/g, '')
            .toUpperCase();
        } catch (error) {
          currentBlock = 'P';
        }

        const beforeHtml = editor.innerHTML;
        const targetBlock = currentBlock === 'BLOCKQUOTE' ? 'P' : 'BLOCKQUOTE';
        // formatBlock도 일부 Chromium 버전에서 beforeinput 없이 input만 발생합니다.
        // 인용구 전환 전후를 직접 기록해 Ctrl+Z 한 번으로 되돌아가게 합니다.
        breakEditorHistoryGroup();
        pendingInputBeforeHtml = null;
        pendingInputHistoryGroup = '';
        suppressingInputHistory = true;
        try {
          runCommand('formatBlock', targetBlock);
        } finally {
          suppressingInputHistory = false;
        }
        pushEditorHistory(beforeHtml, editor.innerHTML);
        breakEditorHistoryGroup();
        saveSelection();
        updateFormattingControlsState();
      };

      Object.entries(SYMBOL_GROUPS).forEach(([group, symbols]) => {
        const container = symbolPicker.querySelector(`[data-symbol-group="${group}"]`);
        symbols.forEach((symbol) => {
          const button = document.createElement('button');
          button.className = 'symbol-button';
          button.type = 'button';
          button.dataset.symbol = symbol;
          button.textContent = symbol;
          button.title = `${symbol} 문자 삽입`;
          button.setAttribute('aria-label', `${symbol} 문자 삽입`);
          button.addEventListener('mousedown', (event) => event.preventDefault());
          button.addEventListener('click', () => insertLiteralSymbol(symbol));
          container.appendChild(button);
        });
      });

      const clampTableSize = (value, maximum) => Math.max(1, Math.min(maximum, Number.parseInt(value, 10) || 1));

      const placeCaretInCell = (cell) => {
        if (!cell) return;
        const range = document.createRange();
        range.selectNodeContents(cell);
        range.collapse(true);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        savedRange = range.cloneRange();
      };

      const appendTableRowUndoably = (table) => {
        const beforeHtml = editor.innerHTML;
        const columnCount = Math.max(1, table.rows[0]?.cells.length || 1);
        const marker = `appended-table-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const replacement = table.cloneNode(true);
        replacement.setAttribute('data-append-marker', marker);
        const row = replacement.insertRow();
        for (let column = 0; column < columnCount; column += 1) {
          row.insertCell().innerHTML = '<br>';
        }

        const range = document.createRange();
        range.selectNode(table);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        let insertedTable = null;
        suppressingInputHistory = true;
        try {
          document.execCommand('insertHTML', false, replacement.outerHTML);
          insertedTable = editor.querySelector(`[data-append-marker="${marker}"]`);
          insertedTable?.removeAttribute('data-append-marker');
        } finally {
          suppressingInputHistory = false;
        }
        if (!insertedTable) return null;
        pushEditorHistory(beforeHtml, editor.innerHTML);
        updateCount();
        return insertedTable.rows[insertedTable.rows.length - 1]?.cells[0] || null;
      };

      const insertTable = (requestedRows, requestedColumns) => {
        const beforeHtml = editor.innerHTML;
        const rows = clampTableSize(requestedRows, 50);
        const columns = clampTableSize(requestedColumns, 20);
        const useHeader = tableHeaderRow.checked;
        const marker = `inserted-table-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const body = Array.from({ length: rows }, (_, rowIndex) => {
          const tag = useHeader && rowIndex === 0 ? 'th' : 'td';
          const cells = Array.from({ length: columns }, () => `<${tag}><br></${tag}>`).join('');
          return `<tr>${cells}</tr>`;
        }).join('');

        restoreSelection();
        focusEditor();
        suppressingInputHistory = true;
        try {
          document.execCommand('insertHTML', false,
            `<table data-insert-marker="${marker}"><tbody>${body}</tbody></table>`);
          const table = editor.querySelector(`[data-insert-marker="${marker}"]`);
          if (table) {
            table.removeAttribute('data-insert-marker');
            placeCaretInCell(table.querySelector('th,td'));
          }
        } finally {
          suppressingInputHistory = false;
        }
        closeTablePicker();
        normalizeEmptyDocument();
        pushEditorHistory(beforeHtml, editor.innerHTML);
        updateCount();
        updateFormattingControlsState();
      };

      const selectedTableCell = () => {
        const selection = window.getSelection();
        if (!selection || !selection.rangeCount || !selectionIsInsideEditor()) return null;
        const node = selection.anchorNode;
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        return element?.closest?.('th,td') || null;
      };

      for (let row = 1; row <= 8; row += 1) {
        for (let column = 1; column <= 10; column += 1) {
          const cell = document.createElement('button');
          cell.className = 'table-grid-cell';
          cell.type = 'button';
          cell.setAttribute('role', 'gridcell');
          cell.dataset.tableRow = String(row);
          cell.dataset.tableColumn = String(column);
          cell.title = `${row}행 × ${column}열`;
          cell.addEventListener('mouseenter', () => updateTableGridHighlight(row, column));
          cell.addEventListener('focus', () => updateTableGridHighlight(row, column));
          cell.addEventListener('click', () => insertTable(row, column));
          tableGrid.appendChild(cell);
        }
      }

      const updateSelectionToolbarState = () => {
        selectionCommandButtons.forEach((button) => {
          let isActive = false;
          try {
            isActive = document.queryCommandState(button.dataset.selectionCommand);
          } catch (error) {
            isActive = false;
          }
          button.setAttribute('aria-pressed', String(isActive));
        });
      };

      const showSelectionToolbar = () => {
        const selection = window.getSelection();
        if (!selection
          || selection.isCollapsed
          || !selection.rangeCount
          || !selectionIsInsideEditor()
          || findbar.contains(document.activeElement)) {
          hideSelectionToolbar();
          return;
        }

        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        if (!rect.width && !rect.height) {
          hideSelectionToolbar();
          return;
        }

        savedRange = range.cloneRange();
        updateSelectionToolbarState();
        selectionToolbar.classList.add('visible');
        const toolbarRect = selectionToolbar.getBoundingClientRect();
        const left = Math.min(
          Math.max(8, rect.left + (rect.width - toolbarRect.width) / 2),
          window.innerWidth - toolbarRect.width - 8
        );
        const preferredTop = rect.top - toolbarRect.height - 8;
        const top = preferredTop >= 8 ? preferredTop : Math.min(window.innerHeight - toolbarRect.height - 8, rect.bottom + 8);
        selectionToolbar.style.left = `${left}px`;
        selectionToolbar.style.top = `${top}px`;
      };

      const saveSelection = () => {
        const selection = window.getSelection();
        if (selection && selection.rangeCount && selectionIsInsideEditor()) {
          savedRange = selection.getRangeAt(0).cloneRange();
        }
      };

      const restoreSelection = () => {
        if (!savedRange) return;
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(savedRange);
      };

      const placeCaretAtStart = (element) => {
        const range = document.createRange();
        range.setStart(element, 0);
        range.collapse(true);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        savedRange = range.cloneRange();
      };

      const normalizeEmptyDocument = (force = false) => {
        const text = editor.textContent.replace(/\u200B/g, '').trim();
        const hasNonTextContent = Boolean(editor.querySelector('img, hr, table, iframe, video, audio, canvas, svg'));
        if (!force && (text || hasNonTextContent)) return false;

        const first = editor.firstElementChild;
        const alreadyNormal = editor.childElementCount === 1
          && first?.tagName === 'P'
          && !first.textContent.replace(/\u200B/g, '').trim()
          && !first.querySelector('img, hr, table, iframe, video, audio, canvas, svg');
        if (alreadyNormal && !force) return false;

        editor.innerHTML = '<p><br></p>';
        placeCaretAtStart(editor.firstElementChild);
        return true;
      };

      const clearFormatting = () => {
        focusEditor();
        restoreSelection();
        document.execCommand('removeFormat', false, null);
        document.execCommand('unlink', false, null);
        document.execCommand('formatBlock', false, 'P');
        normalizeEmptyDocument();
        blockFormat.value = 'P';
        updateCount();
        saveSelection();
        updateFormattingControlsState();
        showToast('글자와 문단 서식을 제거했습니다.');
      };

      const isUrl = (value) => /^(https?:\/\/|mailto:|tel:)[^\s]+$/i.test(value.trim());

      const showLinkPreview = (anchor) => {
        const href = anchor.getAttribute('href') || anchor.href || '';
        if (!href) return;
        hoveredLink = anchor;
        linkPreviewUrl.href = href;
        linkPreviewUrl.textContent = href;
        linkPreviewCopy.textContent = '주소 복사';
        linkPreview.classList.remove('above');
        linkPreview.classList.add('visible');

        const anchorRect = anchor.getBoundingClientRect();
        const tooltipRect = linkPreview.getBoundingClientRect();
        const margin = 8;
        let left = Math.min(anchorRect.left, window.innerWidth - tooltipRect.width - 12);
        left = Math.max(12, left);
        let top = anchorRect.bottom + margin;
        if (top + tooltipRect.height > window.innerHeight - 12) {
          top = Math.max(12, anchorRect.top - tooltipRect.height - margin);
          linkPreview.classList.add('above');
        }
        linkPreview.style.left = `${left}px`;
        linkPreview.style.top = `${top}px`;
      };

      const hideLinkPreview = () => {
        hoveredLink = null;
        linkPreview.classList.remove('visible');
      };

      const copyPreviewUrl = async () => {
        const url = linkPreviewUrl.getAttribute('href') || linkPreviewUrl.textContent || '';
        if (!url) return;
        let copied = false;
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(url);
            copied = true;
          } catch (error) {
            copied = false;
          }
        }
        if (!copied) {
          const textarea = document.createElement('textarea');
          textarea.value = url;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          copied = document.execCommand('copy');
          textarea.remove();
        }
        linkPreviewCopy.textContent = copied ? '복사됨' : '복사 실패';
      };

      const insertLink = (urlOverride = '') => {
        restoreSelection();
        focusEditor();
        const selection = window.getSelection();
        const selectedText = selection ? selection.toString() : '';
        const initial = urlOverride || (isUrl(selectedText) ? selectedText : 'https://');
        const url = window.prompt('연결할 주소를 입력하세요.', initial);
        if (!url) return;

        const trimmed = url.trim();
        // 스킴만 있는 값(기본값 https:// 를 그대로 확인한 경우)은 거부합니다.
        if (!isUrl(trimmed)) {
          showToast('http://, https://, mailto:, tel: 뒤에 주소를 입력하세요.');
          return;
        }

        restoreSelection();
        if (selection && !selection.isCollapsed) {
          document.execCommand('createLink', false, trimmed);
        } else {
          const label = trimmed;
          document.execCommand('insertHTML', false, `<a href="${escapeAttribute(label)}">${escapeHtml(label)}</a>`);
        }
        updateCount();
      };

      const escapeHtml = (value) => String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      const escapeAttribute = (value) => escapeHtml(value).replace(/`/g, '&#096;');

      const FORMAT_LABELS = {
        bold: '굵게',
        italic: '기울임',
        underline: '밑줄',
        strikeThrough: '취소선'
      };
      const FORMAT_STATE_LABELS = { none: '변경 없음', apply: '적용', remove: '제거' };
      const FORMAT_STATE_ORDER = ['none', 'apply', 'remove'];

      const replacementFormatState = (button) => button.dataset.formatState || 'none';

      const getReplacementFormatSettings = () => {
        const apply = [];
        const remove = [];
        replaceFormatButtons.forEach((button) => {
          const state = replacementFormatState(button);
          if (state === 'apply') apply.push(button.dataset.replaceFormat);
          else if (state === 'remove') remove.push(button.dataset.replaceFormat);
        });
        return { apply, remove };
      };

      const FORMAT_PREVIEW_KEYS = {
        bold: 'bold',
        italic: 'italic',
        underline: 'underline',
        strikeThrough: 'strike'
      };
      const EMPTY_FORMAT_STATE = { bold: false, italic: false, underline: false, strike: false };

      const formatStateAtNode = (node) => {
        const chain = [];
        let element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        while (element && element !== editor && editor.contains(element)) {
          chain.push(element);
          element = element.parentElement;
        }
        let state = { ...EMPTY_FORMAT_STATE };
        chain.reverse().forEach((item) => { state = docxStateForElement(item, state); });
        return state;
      };

      const matchFormatState = () => {
        const selection = window.getSelection();
        let range = null;
        if (selection && selection.rangeCount && selectionIsInsideEditor()) {
          range = selection.getRangeAt(0);
        } else if (savedRange) {
          range = savedRange;
        }
        if (!range) return { ...EMPTY_FORMAT_STATE };
        try {
          if (range.collapsed) return formatStateAtNode(range.startContainer);

          const states = [];
          const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
          while (walker.nextNode()) {
            const node = walker.currentNode;
            if (!node.nodeValue || !range.intersectsNode(node)) continue;
            states.push(formatStateAtNode(node));
          }
          if (!states.length) return formatStateAtNode(range.startContainer);

          return Object.keys(EMPTY_FORMAT_STATE).reduce((result, key) => {
            const first = states[0][key];
            result[key] = states.every((state) => state[key] === first) ? first : null;
            return result;
          }, {});
        } catch (error) {
          return { ...EMPTY_FORMAT_STATE };
        }
      };

      const resultingFormatState = (base) => {
        const next = { ...base };
        replaceFormatButtons.forEach((button) => {
          const key = FORMAT_PREVIEW_KEYS[button.dataset.replaceFormat];
          const state = replacementFormatState(button);
          if (state === 'apply') next[key] = true;
          else if (state === 'remove') next[key] = false;
        });
        return next;
      };

      const applyFormatStateToInput = (input, state) => {
        const decorations = [];
        if (state.underline) decorations.push('underline');
        if (state.strike) decorations.push('line-through');
        input.style.fontWeight = state.bold ? '700' : '';
        input.style.fontStyle = state.italic ? 'italic' : '';
        input.style.textDecoration = decorations.join(' ');
        const mixed = Object.values(state).some((value) => value === null);
        const baseTitle = input === findText
          ? '찾은 글자의 서식을 표시합니다.'
          : '지정한 바꿀 서식을 적용한 결과를 표시합니다.';
        input.title = mixed ? `${baseTitle} 선택 영역에는 서로 다른 서식이 섞여 있습니다.` : baseTitle;
      };

      const updateReplacementFormatPreview = () => {
        if (!findbarReplaceMode) {
          applyFormatStateToInput(findText, EMPTY_FORMAT_STATE);
          applyFormatStateToInput(replaceText, EMPTY_FORMAT_STATE);
          return;
        }
        const base = matchFormatState();
        applyFormatStateToInput(findText, base);
        applyFormatStateToInput(replaceText, resultingFormatState(base));
      };

      const updateReplacementFormatSummary = () => {
        const parts = replaceFormatButtons
          .filter((button) => replacementFormatState(button) !== 'none')
          .map((button) => `${FORMAT_LABELS[button.dataset.replaceFormat]} ${FORMAT_STATE_LABELS[replacementFormatState(button)]}`);
        const keepsText = Boolean(parts.length) && !replaceText.value;
        const summary = parts.length
          ? `서식: ${parts.join(' · ')}${keepsText ? ' · 글자는 유지' : ''}`
          : '서식: 변경 없음';
        if (replaceFormatHint.textContent !== summary) replaceFormatHint.textContent = summary;
        replaceFormatReset.disabled = !parts.length;
        updateReplacementFormatPreview();
      };

      const setReplacementFormatState = (button, state) => {
        button.dataset.formatState = state;
        const label = FORMAT_LABELS[button.dataset.replaceFormat] || '';
        const nextState = FORMAT_STATE_ORDER[(FORMAT_STATE_ORDER.indexOf(state) + 1) % FORMAT_STATE_ORDER.length];
        button.setAttribute('aria-label', `${label} 서식: ${FORMAT_STATE_LABELS[state]}`);
        button.title = `${label}: ${FORMAT_STATE_LABELS[state]} (누르면 ${FORMAT_STATE_LABELS[nextState]})`;
      };

      const resetReplacementFormatStates = () => {
        replaceFormatButtons.forEach((button) => setReplacementFormatState(button, 'none'));
        updateReplacementFormatSummary();
      };

      const hasReplacementFormatSettings = (settings) => Boolean(settings.apply.length || settings.remove.length);

      const unwrapElement = (element) => {
        const parent = element.parentNode;
        if (!parent) return;
        while (element.firstChild) parent.insertBefore(element.firstChild, element);
        element.remove();
      };

      // ===== 인라인 서식 엔진 =====
      // document.execCommand는 선택 영역에 대한 "토글"만 제공하므로 서식이 섞인
      // 범위에 절대 상태(반드시 해제)를 지정할 수 없습니다. queryCommandState가
      // 혼합 범위에서 false를 돌려주면 해제 명령이 아예 실행되지 않기 때문입니다.
      // 그래서 서식 적용/해제를 DOM 조작으로 직접 구현합니다.
      // 여기의 모든 함수는 편집기 본체와 분리된 복제본에서도 동작해야 하므로
      // 대상 root를 인자로 받고 전역 selection을 건드리지 않습니다.
      const FORMAT_DEFINITIONS = {
        bold: { tag: 'b', selector: 'b,strong' },
        italic: { tag: 'i', selector: 'i,em' },
        underline: { tag: 'u', selector: 'u' },
        strikeThrough: { tag: 's', selector: 's,strike,del' }
      };

      const FORMAT_DECORATIONS = { underline: 'underline', strikeThrough: 'line-through' };

      const styleCarriesFormat = (element, format) => {
        const style = element.style;
        if (!style) return false;
        if (format === 'bold') {
          const weight = String(style.fontWeight || '');
          return weight === 'bold' || Number.parseInt(weight, 10) >= 600;
        }
        if (format === 'italic') return style.fontStyle === 'italic';
        const decoration = String(style.textDecorationLine || style.textDecoration || '');
        return decoration.includes(FORMAT_DECORATIONS[format]);
      };

      const clearFormatStyle = (element, format) => {
        const style = element.style;
        if (!style) return;
        if (format === 'bold') style.fontWeight = '';
        else if (format === 'italic') style.fontStyle = '';
        else {
          const decoration = String(style.textDecorationLine || style.textDecoration || '');
          const next = decoration.split(/\s+/)
            .filter((value) => value && value !== FORMAT_DECORATIONS[format])
            .join(' ');
          style.textDecoration = next;
          if (style.textDecorationLine) style.textDecorationLine = next;
        }
        if (!element.getAttribute('style')?.trim()) element.removeAttribute('style');
      };

      const elementCarriesFormat = (element, format) => {
        if (element.nodeType !== Node.ELEMENT_NODE) return false;
        const definition = FORMAT_DEFINITIONS[format];
        if (!definition) return false;
        return element.matches(definition.selector) || styleCarriesFormat(element, format);
      };

      const formatActiveAt = (node, root, format) => {
        for (let element = node.parentNode; element && element !== root; element = element.parentNode) {
          if (elementCarriesFormat(element, format)) return true;
        }
        return false;
      };

      // 범위와 겹치는 텍스트 노드를, 범위 경계에서 정확히 쪼개어 돌려줍니다.
      const splitTextNodesInRange = (range, root) => {
        const overlaps = [];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (!node.nodeValue) continue;
          if (!range.intersectsNode(node)) continue;
          const start = node === range.startContainer ? range.startOffset : 0;
          const end = node === range.endContainer ? range.endOffset : node.nodeValue.length;
          if (start >= end) continue;
          overlaps.push({ node, start, end });
        }
        // 쪼개기는 수집이 끝난 뒤에 합니다. 도중에 하면 walker가 새 노드를 다시 봅니다.
        return overlaps.map(({ node, start, end }) => {
          let target = node;
          if (end < target.nodeValue.length) target.splitText(end);
          if (start > 0) target = target.splitText(start);
          return target;
        });
      };

      // node를 ancestor 밖으로 끌어냅니다. ancestor를 [앞][node][뒤]로 나누되
      // 중간 래퍼(예: <b> 안의 <em>)는 그대로 보존합니다.
      const splitAncestorAround = (node, ancestor, format) => {
        const doc = ancestor.ownerDocument;
        const parent = ancestor.parentNode;
        if (!parent) return;

        const tailRange = doc.createRange();
        tailRange.setStartAfter(node);
        tailRange.setEnd(ancestor, ancestor.childNodes.length);
        const tailFragment = tailRange.extractContents();

        const headRange = doc.createRange();
        headRange.setStart(ancestor, 0);
        headRange.setEndBefore(node);
        const headFragment = headRange.extractContents();

        // 이제 ancestor에는 node를 감싼 중간 래퍼만 남아 있습니다.
        const middle = doc.createDocumentFragment();
        while (ancestor.firstChild) middle.appendChild(ancestor.firstChild);

        // 서식이 인라인 스타일로 표현된 경우, 그 속성만 지운 사본으로 감싸
        // 색상 등 다른 스타일은 잃지 않게 합니다.
        let middleRoot = middle;
        if (!ancestor.matches(FORMAT_DEFINITIONS[format].selector)) {
          const keeper = ancestor.cloneNode(false);
          clearFormatStyle(keeper, format);
          if (keeper.attributes.length) {
            keeper.appendChild(middle);
            middleRoot = keeper;
          }
        }

        const head = ancestor.cloneNode(false);
        head.appendChild(headFragment);
        const tail = ancestor.cloneNode(false);
        tail.appendChild(tailFragment);

        if (head.firstChild) parent.insertBefore(head, ancestor);
        parent.insertBefore(middleRoot, ancestor);
        if (tail.firstChild) parent.insertBefore(tail, ancestor);
        ancestor.remove();
      };

      const liftNodeOutOfFormat = (node, root, format) => {
        for (let guard = 0; guard < 64; guard += 1) {
          let outermost = null;
          for (let element = node.parentNode; element && element !== root; element = element.parentNode) {
            if (elementCarriesFormat(element, format)) outermost = element;
          }
          if (!outermost) return;
          splitAncestorAround(node, outermost, format);
        }
      };

      const rangeAround = (nodes) => {
        const range = document.createRange();
        range.setStartBefore(nodes[0]);
        range.setEndAfter(nodes[nodes.length - 1]);
        return range;
      };

      // 범위 안의 해당 서식을 확실히 제거합니다. 범위 내부의 서식 요소든
      // 범위를 감싼 조상이든, 모든 텍스트 노드를 서식 밖으로 끌어내는
      // 한 가지 방법으로 함께 처리됩니다.
      const removeFormatFromRange = (range, root, format) => {
        const nodes = splitTextNodesInRange(range, root);
        if (!nodes.length) return range;
        nodes.forEach((node) => liftNodeOutOfFormat(node, root, format));
        return rangeAround(nodes);
      };

      const applyFormatToRange = (range, root, format) => {
        const nodes = splitTextNodesInRange(range, root);
        if (!nodes.length) return range;
        const { tag } = FORMAT_DEFINITIONS[format];
        nodes.forEach((node) => {
          if (formatActiveAt(node, root, format)) return;
          const wrapper = node.ownerDocument.createElement(tag);
          node.parentNode.insertBefore(wrapper, node);
          wrapper.appendChild(node);
        });
        return rangeAround(nodes);
      };

      const applyLinkToRange = (range, root, href) => {
        const nodes = splitTextNodesInRange(range, root);
        if (!nodes.length) return range;
        nodes.forEach((node) => {
          if (node.parentElement?.closest('a')) return;
          const anchor = node.ownerDocument.createElement('a');
          anchor.setAttribute('href', href);
          node.parentNode.insertBefore(anchor, node);
          anchor.appendChild(node);
        });
        return rangeAround(nodes);
      };

      const applyFormatSettingsToRange = (range, root, settings) => {
        let current = range;
        settings.remove.forEach((format) => { current = removeFormatFromRange(current, root, format); });
        settings.apply.forEach((format) => { current = applyFormatToRange(current, root, format); });
        return current;
      };

      // 내용이 사라진 인라인 래퍼를 정리합니다.
      const pruneEmptyInlineElements = (root) => {
        [...root.querySelectorAll('b,strong,i,em,u,s,strike,del,span,code,a')].forEach((element) => {
          if (element.textContent) return;
          if (element.querySelector('img,br,hr,table,svg,video,audio,canvas')) return;
          element.remove();
        });
      };
      // ===== 인라인 서식 엔진 끝 =====

      // 브라우저는 URL을 해석할 때 탭·개행 같은 제어문자를 먼저 제거합니다.
      // 그래서 "java&#9;script:..." 같은 값은 실제로 실행되는데도 단순한
      // 문자열 앞부분 비교로는 걸러지지 않습니다. 브라우저와 같은 방식으로
      // 정규화한 뒤 허용된 스킴만 통과시킵니다.
      const SAFE_URL_SCHEMES = new Set(['http:', 'https:', 'mailto:', 'tel:']);

      const isSafeUrlValue = (value, { allowInlineImage = false } = {}) => {
        const normalized = String(value).replace(/[\u0000-\u0020\u00a0]/g, '');
        if (!normalized) return true;
        if (!/^[a-z][a-z0-9+.-]*:/i.test(normalized)) return true; // 스킴 없는 상대 주소
        // 붙여넣은 문서에 들어 있는 인라인 이미지는 살립니다. 단 SVG는
        // 자체적으로 스크립트를 담을 수 있으므로 제외합니다.
        if (allowInlineImage && /^data:image\/(png|jpe?g|gif|webp|bmp|avif);/i.test(normalized)) return true;
        try {
          return SAFE_URL_SCHEMES.has(new URL(normalized, document.baseURI).protocol);
        } catch (error) {
          return false;
        }
      };

      const URL_ATTRIBUTES = new Set(['href', 'src', 'srcdoc', 'srcset', 'action', 'formaction', 'xlink:href', 'data', 'background', 'poster']);

      const sanitizeHtml = (html) => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        // form은 formaction/action 을 통해 저장된 HTML에서 동작할 수 있으므로 함께 제거합니다.
        doc.querySelectorAll('script, style, iframe, object, embed, link, meta, form, base, template, noscript')
          .forEach((node) => node.remove());
        doc.querySelectorAll('*').forEach((node) => {
          [...node.attributes].forEach((attribute) => {
            const name = attribute.name.toLowerCase();
            if (name.startsWith('on')) {
              node.removeAttribute(attribute.name);
              return;
            }
            if (!URL_ATTRIBUTES.has(name)) return;
            const allowInlineImage = name === 'src' && ['IMG', 'VIDEO', 'AUDIO'].includes(node.tagName);
            if (!isSafeUrlValue(attribute.value, { allowInlineImage })) {
              node.removeAttribute(attribute.name);
            }
          });
        });
        return doc.body.innerHTML;
      };

      const parseInlineMarkdown = (source) => {
        const codeTokens = [];
        let value = String(source).replace(/`([^`]+)`/g, (_, code) => {
          const token = `\u0000CODE${codeTokens.length}\u0000`;
          codeTokens.push(`<code>${escapeHtml(code)}</code>`);
          return token;
        });
        value = escapeHtml(value);
        value = value
          .replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1">')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>')
          .replace(/&lt;(https?:\/\/[^&]+)&gt;/g, '<a href="$1">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/__([^_]+)__/g, '<strong>$1</strong>')
          .replace(/~~([^~]+)~~/g, '<s>$1</s>')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
          .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>')
          .replace(/  $/, '<br>');
        // 치환값을 문자열로 넘기면 $&, $`, $' 가 특수 치환으로 해석됩니다.
        // 코드 스팬에 그런 문자가 들어 있으면 내용이 깨지므로 함수로 넘깁니다.
        codeTokens.forEach((html, index) => {
          value = value.replace(`\u0000CODE${index}\u0000`, () => html);
        });
        return value;
      };

      const markdownToHtml = (markdown) => {
        const lines = String(markdown).replace(/\r\n?/g, '\n').split('\n');
        const output = [];
        let paragraph = [];
        let listType = null;
        let inCode = false;
        let codeLines = [];
        let pendingBlankLines = 0;

        const flushParagraph = () => {
          if (!paragraph.length) return;
          output.push(`<p>${paragraph.map(parseInlineMarkdown).join('<br>')}</p>`);
          paragraph = [];
        };

        const closeList = () => {
          if (!listType) return;
          output.push(`</${listType}>`);
          listType = null;
        };

        const emitBlanks = () => {
          for (let i = 0; i < pendingBlankLines; i += 1) {
            output.push('<p class="blank-line"><br></p>');
          }
          pendingBlankLines = 0;
        };

        lines.forEach((line) => {
          if (/^```/.test(line)) {
            flushParagraph();
            closeList();
            if (inCode) {
              output.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              emitBlanks();
              inCode = true;
            }
            return;
          }

          if (inCode) {
            codeLines.push(line);
            return;
          }

          if (!line.trim()) {
            flushParagraph();
            closeList();
            pendingBlankLines += 1;
            return;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          const unordered = line.match(/^\s*[-+*]\s+(?:\[([ xX])\]\s+)?(.+)$/);
          const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          const quote = line.match(/^>\s?(.*)$/);
          const htmlTable = line.match(/^\s*(<table[\s\S]*<\/table>)\s*$/i);

          flushParagraph();
          emitBlanks();

          if (htmlTable) {
            closeList();
            output.push(sanitizeHtml(htmlTable[1]));
          } else if (heading) {
            closeList();
            const level = heading[1].length;
            output.push(`<h${level}>${parseInlineMarkdown(heading[2])}</h${level}>`);
          } else if (/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)) {
            closeList();
            output.push('<hr>');
          } else if (unordered) {
            if (listType !== 'ul') {
              closeList();
              listType = 'ul';
              output.push('<ul>');
            }
            const checked = unordered[1] ? `<input type="checkbox" disabled${unordered[1].toLowerCase() === 'x' ? ' checked' : ''}> ` : '';
            output.push(`<li>${checked}${parseInlineMarkdown(unordered[2])}</li>`);
          } else if (ordered) {
            if (listType !== 'ol') {
              closeList();
              listType = 'ol';
              output.push('<ol>');
            }
            output.push(`<li>${parseInlineMarkdown(ordered[1])}</li>`);
          } else if (quote) {
            closeList();
            output.push(`<blockquote>${parseInlineMarkdown(quote[1])}</blockquote>`);
          } else {
            closeList();
            paragraph.push(line);
          }
        });

        if (inCode) output.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        flushParagraph();
        closeList();
        emitBlanks();
        return output.join('');
      };

      const inlineHtmlToMarkdown = (node) => {
        if (node.nodeType === Node.TEXT_NODE) return node.nodeValue || '';
        if (node.nodeType !== Node.ELEMENT_NODE) return '';
        const children = [...node.childNodes].map(inlineHtmlToMarkdown).join('');
        const tag = node.tagName.toLowerCase();
        if (tag === 'strong' || tag === 'b') return `**${children}**`;
        if (tag === 'em' || tag === 'i') return `*${children}*`;
        if (tag === 's' || tag === 'strike' || tag === 'del') return `~~${children}~~`;
        if (tag === 'u') return `<u>${children}</u>`;
        if (tag === 'code' && node.parentElement?.tagName.toLowerCase() !== 'pre') return `\`${children}\``;
        if (tag === 'a') return `[${children}](${node.getAttribute('href') || ''})`;
        if (tag === 'img') return `![${node.getAttribute('alt') || ''}](${node.getAttribute('src') || ''})`;
        if (tag === 'br') return '\n';
        return children;
      };

      const htmlToMarkdown = () => {
        const convertBlock = (node, depth = 0) => {
          if (node.nodeType === Node.TEXT_NODE) return node.nodeValue || '';
          if (node.nodeType !== Node.ELEMENT_NODE) return '';
          const tag = node.tagName.toLowerCase();
          const inline = () => [...node.childNodes].map(inlineHtmlToMarkdown).join('').trimEnd();
          // h4~h6은 편집기 메뉴에는 없지만 외부 HTML을 열면 들어옵니다.
          // 처리하지 않으면 기본 분기로 떨어져 개행 없이 옆 글자와 붙습니다.
          const heading = tag.match(/^h([1-6])$/);
          if (heading) return `${'#'.repeat(Number(heading[1]))} ${inline()}\n\n`;
          if (tag === 'p' || tag === 'div') {
            const value = inline();
            return value ? `${value}\n\n` : '\n';
          }
          if (tag === 'blockquote') return inline().split('\n').map((line) => `> ${line}`).join('\n') + '\n\n';
          if (tag === 'pre') return `\`\`\`\n${node.innerText.replace(/\n$/, '')}\n\`\`\`\n\n`;
          if (tag === 'hr') return '---\n\n';
          if (tag === 'table') {
            return `${sanitizeHtml(node.outerHTML).replace(/\r?\n/g, '')}\n\n`;
          }
          if (tag === 'ul' || tag === 'ol') {
            // 중첩 목록은 자식 ul/ol을 따로 떼어 depth를 올려 재귀합니다.
            // 예전에는 depth가 증가하지 않고 중첩 목록이 인라인으로 취급되어
            // 안쪽 항목이 바깥 항목 뒤에 그대로 붙어 버렸습니다.
            return [...node.children]
              .filter((child) => child.tagName === 'LI')
              .map((li, index) => {
                const marker = tag === 'ol' ? `${index + 1}. ` : '- ';
                const nestedLists = [...li.children].filter((child) => ['UL', 'OL'].includes(child.tagName));
                const own = [...li.childNodes]
                  .filter((child) => !(child.nodeType === Node.ELEMENT_NODE && ['UL', 'OL'].includes(child.tagName)))
                  .map(inlineHtmlToMarkdown)
                  .join('')
                  .trim();
                const line = `${'  '.repeat(depth)}${marker}${own}`;
                const nested = nestedLists
                  .map((child) => convertBlock(child, depth + 1).replace(/\n+$/, ''))
                  .filter(Boolean)
                  .join('\n');
                return nested ? `${line}\n${nested}` : line;
              })
              .join('\n') + '\n\n';
          }
          return [...node.childNodes].map((child) => convertBlock(child, depth)).join('');
        };
        return [...editor.childNodes].map((node) => convertBlock(node)).join('').replace(/\n{4,}/g, '\n\n\n').trimEnd() + '\n';
      };

      const buildStandaloneHtml = () => `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(currentFileName.replace(/\.[^.]+$/, '') || '문서')}</title>
<style>
body{max-width:780px;margin:40px auto;padding:0 24px;color:#202124;font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:16px;line-height:1.75;tab-size:4;word-break:break-word}
p,h1,h2,h3,blockquote,li,pre,th,td{white-space:pre-wrap}p{margin:0 0 1em}p.blank-line{min-height:1.75em;margin:0}h1{font-size:2em}h2{font-size:1.55em}h3{font-size:1.25em}blockquote{margin:1em 0;padding:.5em 1em;border-left:4px solid #94a3b8;background:#f8fafc;color:#475569}pre{overflow:auto;padding:14px 16px;border-radius:8px;background:#f4f5f7}code{font-family:Consolas,monospace}a{color:#1558d6}img{max-width:100%;height:auto}hr{border:0;border-top:1px solid #cdd2d9;margin:2em 0}table{width:100%;margin:.8em 0 1em;border-collapse:collapse;table-layout:fixed}th,td{padding:8px 10px;border:1px solid #9ca3af;vertical-align:top}th{background:#f1f5f9;font-weight:700}
</style>
</head>
<body>
${sanitizeHtml(editor.innerHTML)}
</body>
</html>`;

      const downloadText = (content, fileName, mime) => {
        const blob = new Blob([content], { type: `${mime};charset=utf-8` });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const suggestedName = (extension) => {
        const base = (currentFileName || '문서').replace(/\.(md|markdown|txt|html?|docx?)$/i, '') || '문서';
        return `${base}.${extension}`;
      };

      const xmlEscape = (value) => String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');

      const docxColorValue = (value) => {
        const color = String(value || '').trim();

        if (shortHex) return shortHex[1].split('').map((part) => part + part).join('').toUpperCase();
        const longHex = color.match(/^#([0-9a-f]{6})$/i);
        if (longHex) return longHex[1].toUpperCase();
        const rgb = color.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        if (!rgb) return '';
        return rgb.slice(1, 4).map((part) => Math.max(0, Math.min(255, Number(part))).toString(16).padStart(2, '0')).join('').toUpperCase();
      };

      const docxStateForElement = (element, inherited = {}) => {
        const next = { ...inherited };
        const tag = element.tagName;
        if (['B', 'STRONG'].includes(tag)) next.bold = true;
        if (['I', 'EM'].includes(tag)) next.italic = true;
        if (tag === 'U') next.underline = true;
        if (['S', 'STRIKE', 'DEL'].includes(tag)) next.strike = true;
        if (tag === 'SUP') next.superscript = true;
        if (tag === 'SUB') next.subscript = true;
        if (tag === 'CODE') next.code = true;

        const weight = String(element.style?.fontWeight || '');
        if (weight === 'bold' || Number.parseInt(weight, 10) >= 600) next.bold = true;
        if (element.style?.fontStyle === 'italic') next.italic = true;
        const decoration = String(element.style?.textDecorationLine || element.style?.textDecoration || '');
        if (decoration.includes('underline')) next.underline = true;
        if (decoration.includes('line-through')) next.strike = true;
        const color = docxColorValue(element.style?.color);
        if (color) next.color = color;
        return next;
      };

      const docxRunProperties = (state) => {
        const properties = [];
        if (state.bold) properties.push('<w:b/>');
        if (state.italic) properties.push('<w:i/>');
        if (state.underline) properties.push('<w:u w:val="single"/>');
        if (state.strike) properties.push('<w:strike/>');
        if (state.superscript) properties.push('<w:vertAlign w:val="superscript"/>');
        if (state.subscript) properties.push('<w:vertAlign w:val="subscript"/>');
        if (state.color) properties.push('<w:color w:val="' + state.color + '"/>');
        if (state.code) {
          properties.push('<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:eastAsia="Consolas"/>');
          properties.push('<w:sz w:val="21"/><w:szCs w:val="21"/>');
          properties.push('<w:shd w:val="clear" w:color="auto" w:fill="F3F4F6"/>');

      const docxTextRuns = (text, state) => String(text || '')
        .replace(/\r\n?/g, '\n')
        .split(/(\n|\t)/)
        .map((part) => {
          if (part === '\n') return '<w:r><w:br/></w:r>';
          if (part === '\t') return '<w:r><w:tab/></w:r>';

        .join('');

      const docxInlineNodes = (nodes, context, inherited = {}) => [...nodes].map((node) => {

        if (node.nodeType !== Node.ELEMENT_NODE) return '';

          if (!relationshipId) {
            relationshipId = 'rId' + context.nextRelationshipId;
            context.nextRelationshipId += 1;

          return '<w:hyperlink r:id="' + relationshipId + '" w:history="1">' + content + '</w:hyperlink>';

      const docxParagraphXml = (element, context, options = {}) => {
        const styleId = options.styleId || 'Normal';
        const properties = ['<w:pStyle w:val="' + styleId + '"/>'];
        if (options.numbering) {
          properties.push(

        if (['left', 'center', 'right', 'justify'].includes(alignment)) properties.push('<w:jc w:val="' + alignment + '"/>');

        const nodes = options.nodes || element?.childNodes || [];
        const runs = docxInlineNodes(nodes, context, options.initialState || {});
        return '<w:p><w:pPr>' + properties.join('') + '</w:pPr>' + runs + '</w:p>';
      };

      const docxHorizontalRuleXml = () => '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="CBD5E1"/></w:pBdr><w:spacing w:before="120" w:after="120"/></w:pPr></w:p>';

      const docxListXml = (list, context, level = 0) => [...list.children]
        .filter((item) => item.tagName === 'LI')
        .map((item) => {
          const inlineNodes = [...item.childNodes].filter((node) =>
            node.nodeType !== Node.ELEMENT_NODE || !['UL', 'OL'].includes(node.tagName)
